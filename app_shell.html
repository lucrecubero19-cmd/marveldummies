*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg-deep); color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
::selection{background:var(--accent-soft)}
button,input,textarea{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{
  max-width:560px; margin:0 auto; height:100vh; height:100dvh;
  background:var(--bg); display:flex; flex-direction:column; position:relative;
  transition:background .25s ease, color .25s ease;
}
@media (min-width:900px){
  html, body{ background:var(--bg); }
  #app{
    max-width:none; width:100%; height:100dvh; margin:0; border-radius:0; box-shadow:none;
  }
  .app-header .tab-panel, .app-content > .tab-panel{ max-width:820px; margin:0 auto; }
  .tabbar{ max-width:900px; margin:0 auto; }
}

.account-pill{ position:absolute; top:calc(env(safe-area-inset-top) + 22px + clamp(20px,7.6vw,40px) * 1.15); right:20px; transform:translateY(-50%); z-index:3; border:0; padding:0; background:none; cursor:pointer; }
.account-avatar{ display:flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:50%; background:var(--accent); color:var(--bg); font-family:var(--font-heading); font-weight:400; font-size:15px; }
.account-pill-out{ font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-weight:700; font-size:12px; padding:7px 12px; border-radius:20px; background:var(--surface); border:1px solid var(--divider) !important; color:var(--text); }

/* ---------- header ---------- */
.app-header{ flex:none; position:relative; padding:calc(env(safe-area-inset-top) + 22px) 20px 16px; overflow:hidden; max-height:600px; transition:max-height .25s ease, opacity .2s ease, padding-bottom .25s ease; }
.app-header.is-collapsed{ max-height:0; opacity:0; padding-bottom:0; }
.app-header::after{
  content:''; position:absolute; left:20px; right:20px; bottom:0; height:1px;
  border-bottom:2px dotted currentColor; opacity:.25; color:var(--text); pointer-events:none;
}
.eyebrow{ font-family:var(--font-heading); font-weight:400; font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); margin:0 0 4px; }
.brand-title{ font-family:var(--font-heading); font-weight:400; font-size:clamp(20px,7.6vw,40px); letter-spacing:-0.02em; text-transform:uppercase; color:var(--accent); text-align:center; white-space:nowrap; margin:0 auto 4px; max-width:calc(100% - 108px); overflow:hidden; text-overflow:ellipsis; }
.brand-sub{ font-family:var(--font-heading); font-weight:400; font-size:28px; margin:0 0 10px; text-align:center; text-wrap:balance; }
.title{ font-family:var(--font-heading); font-weight:400; font-size:29px; line-height:1.06; margin:0; text-wrap:balance; }
.caption{ font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-size:11.5px; color:var(--text-dim); margin:8px 0 0; }
.filters-toggle{ display:inline-block; margin-top:10px; padding:0; border:0; background:none; font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-size:12px; font-weight:600; color:var(--text-dim); cursor:pointer; }
.filters-toggle:active{ color:var(--accent) }

.search{ width:100%; margin-top:14px; padding:10px 12px; font-size:14px; background:var(--surface-2); border:1px solid var(--divider); border-radius:var(--card-radius); color:var(--text); }
.search::placeholder{ color:var(--text-faint) }

.seg{ display:flex; margin-top:12px; border:1px solid var(--divider); border-radius:var(--card-radius); overflow:hidden; }

.legal-modal{ position:absolute; inset:0; z-index:6; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; }

.toast{ position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom) + 78px); transform:translateX(-50%); z-index:7; max-width:calc(100% - 40px); padding:11px 16px; border-radius:24px; background:var(--text); color:var(--bg); font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-size:12.5px; font-weight:600; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.3); cursor:pointer; animation:toastIn .25s cubic-bezier(.2,.9,.3,1) both; }
@keyframes toastIn{ from{ opacity:0; transform:translateX(-50%) translateY(8px); } to{ opacity:1; transform:translateX(-50%) translateY(0); } }
.legal-card h3{ font-family:var(--font-heading); font-weight:400; font-size:20px; margin:0 0 10px; }
.legal-card p{ font-size:13px; line-height:1.55; color:var(--text-dim); margin:0 0 12px; }
.app-content::-webkit-scrollbar{ display:none }
.tab-panel{ animation:fadeSlide .22s ease both; }
@keyframes fadeSlide{ from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
@media (prefers-reduced-motion:reduce){

.section-label{ font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); margin:20px 0 10px; }
.section-label:first-child{ margin-top:8px }

/* era accordion */
.era{ border-bottom:1px solid var(--divider); }
.era-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 0; cursor:pointer; background:none; border:0; width:100%; text-align:left; font:inherit; color:inherit; }
.era-head:active{ transform:scale(.98) }
.era-head[data-static="1"]{ cursor:default }
.era-name{ font-family:var(--font-heading); font-weight:400; font-size:18px; margin:0 0 2px; text-wrap:balance; }
.era-years{ font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-size:11px; color:var(--text-dim); }
.era-blurb{ font-size:12.5px; line-height:1.5; opacity:.82; margin:0 0 10px; }
.era-meta{ display:flex; align-items:center; gap:10px; flex:none; }
.chip{ font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-size:10.5px; font-weight:700; letter-spacing:.02em; padding:3px 10px; border-radius:var(--chip-radius); background:var(--surface-2); color:var(--text-dim); white-space:nowrap; font-variant-numeric:tabular-nums; }
.chevron{ font-size:13px; color:var(--accent); flex:none; }

/* item row */
.item{ display:flex; gap:12px; padding:14px 0; border-top:1px solid var(--divider); }
.item-check{ flex:none; width:26px; height:26px; margin-top:1px; border-radius:50%; border:1.5px solid var(--accent); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; color:var(--accent-ink); background:transparent; transition:transform .15s ease, background .15s ease; }
.item-check.is-on{ background:var(--accent); }
.item-check:active{ transform:scale(.85) }
.item-body{ flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
.item-tags{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

.fav-btn.is-on{ color:var(--heat); }
.fav-btn:active{ transform:scale(.8); }

.tag-movie{ background:var(--tag-movie-bg); color:var(--tag-movie-fg); }
.tag-series{ background:var(--tag-series-bg); color:var(--tag-series-fg); }
.tag-special{ background:var(--tag-special-bg); color:var(--tag-special-fg); }
.tag-short{ background:transparent; color:var(--tag-short-fg); box-shadow:inset 0 0 0 1px var(--tag-short-fg); }
.item-title{ font-family:var(--font-heading); font-weight:400; font-size:16px; line-height:1.25; margin:0; }

.score-chip.is-hot{ background:var(--tag-movie-bg); color:var(--tag-movie-fg); }

.item-synopsis{ font-size:13.5px; line-height:1.45; opacity:.86; margin:2px 0 0; }

.roadmap-item-dot.is-on{ background:var(--accent); border-color:var(--accent); }

function fmtMin(m){ return m>=60 ? Math.round(m/60)+' hr' : m+' min'; }

var THEMES = [
  {id:'ironman', name:'Tin Can', desc:'Red & gold, high contrast', dots:['#a01623','#ffcb05']},
  {id:'spiderman', name:'Friendly Neighbour', desc:'Dark blue & red', dots:['#0b1440','#e8242a']},
  {id:'cap', name:"America's Ass", desc:'Red, white & blue', dots:['#0a3161','#b31942','#ffffff']},
  {id:'thor', name:'Goldilocks', desc:'Red, blue, black & gold', dots:['#151018','#d9a441','#c8102e']},
  {id:'widow', name:"SHIELD's Best Agent", desc:'Red & black', dots:['#141414','#d0182b']},
  {id:'hulk', name:'Big Guy', desc:'Green & purple', dots:['#16241a','#6bbf59','#9b5de5']}
];
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ---------- accounts (Supabase) ---------- */
var SUPABASE_URL = 'https://yumauklwjtwyhyrynjgr.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_KfBLrn6YHgBgx2CkC-n0hw_-nq8mWiQ';
var sb = (window.supabase && SUPABASE_URL) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:'implicit' }
}) : null;

function signInWithGoogle(){
  if(!sb) return;
  sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: window.location.href } });
}
function signOut(){
  if(!sb) return;
  state.user = null;
  state.displayName = '';
  state.favorites = {}; state.favoriteOrder = []; state.ratings = {}; state.myVote = {};
  commit();
  sb.auth.signOut();
}
function requireAuth(){
  if(state.user) return true;
  state.authPrompt = true;
  commit();
  return false;
}
function dismissAuthPrompt(){ state.authPrompt = false; commit(); }

async function loadRemoteData(){
  if(!sb) return;
  try{
    var res = await sb.from('comments').select('*').order('created_at', {ascending:true});
    if(res.data){
      var byTheory = {};
      res.data.forEach(function(c){ (byTheory[c.theory_id] = byTheory[c.theory_id] || []).push(c); });
      state.remoteComments = byTheory;
    }
  }catch(e){}
  try{
    var vres = await sb.from('votes').select('*');
    if(vres.data){
      var up={}, down={}, mine={};
      vres.data.forEach(function(v){
        if(v.vote_type==='agree') up[v.theory_id]=(up[v.theory_id]||0)+1;
        else down[v.theory_id]=(down[v.theory_id]||0)+1;
        if(state.user && v.user_id===state.user.id) mine[v.theory_id]=v.vote_type;
      });
      state.upvotes=up; state.downvotes=down;
      if(state.user) state.myVote=mine;
    }
  }catch(e){}
  try{
    var tres = await sb.from('user_theories').select('*').order('created_at', {ascending:false});
    if(tres.data){
      state.userTheories = tres.data.map(function(t){ return {id:t.id, title:t.title, body:t.body, heat:1, mine: state.user && t.user_id===state.user.id, authorName:t.user_name}; });
    }
  }catch(e){}
  if(state.user){
    try{
      var pres = await sb.from('profiles').select('*').eq('user_id', state.user.id).maybeSingle();
      if(pres.data && pres.data.display_name){ state.displayName = pres.data.display_name; }
    }catch(e){}
    try{
      var sres = await sb.from('item_stats').select('*').eq('user_id', state.user.id);
      if(sres.data){
        var favs={}, favOrder=[], ratings={};
        sres.data.forEach(function(r){
          if(r.favorite){ favs[r.item_id]=true; favOrder.push(r.item_id); }
          if(r.rating) ratings[r.item_id]=r.rating;
        });
        state.favorites=favs; state.favoriteOrder=favOrder; state.ratings=ratings;
      }
    }catch(e){}
  }
  commit();
}

function initAuth(){
  if(!sb) return;
  sb.auth.getSession().then(function(res){
    state.user = res.data.session ? res.data.session.user : null;
    loadRemoteData();
  });
  sb.auth.onAuthStateChange(function(event, session){
    state.user = session ? session.user : null;
    if(state.user) state.authPrompt = false;
    loadRemoteData();
    if(event === 'SIGNED_IN' && window.history && window.history.replaceState && /access_token|code=/.test(window.location.hash + window.location.search)){
      window.history.replaceState(null, '', window.location.pathname);
    }
  });
}

var STORAGE_KEY = 'mcuRewatch.v1';
function defaultState(){
  return {
    tab:'timeline', section:'connected', viewMode:'chrono', search:'', filtersOpen:true,
    expandedEra:'origins', watched:{}, ratings:{}, watchedOrder:[],
    favorites:{}, favoriteOrder:[], layout:'list', roadmapFocus:null,
    notif:true, theme:'ironman',
    theoryOpen:{}, upvotes:{}, downvotes:{}, myVote:{}, comments:{}, commentDrafts:{},
    userTheories:[], showNewTheory:false, newTheoryTitle:'', newTheoryBody:'',
    theorySearch:'', theorySort:'new', scrolled:false,
    cookieNoticeDismissed:false, showLegal:false, fanNoticeDismissed:false,
    user:null, authPrompt:false, remoteComments:{}, showStoryboard:false,
    displayName:'', displayNameDraft:'', toastMsg:null
  };
}
function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ var merged = Object.assign(defaultState(), JSON.parse(raw)); merged.toastMsg = null; merged.fanNoticeDismissed = false; return merged; }
  }catch(e){}
  return defaultState();
}
var state = loadState();
function persist(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
function commit(){ persist(); render(); }

/* ---------- actions ---------- */
function setTab(t){ state.tab=t; state.scrolled=false; state.roadmapFocus=null; commit(); }
function setSection(v){ state.section=v; commit(); }
function setViewMode(v){ state.viewMode=v; state.roadmapFocus=null; commit(); }
function setSearch(v){ state.search=v; commit(); }
function toggleFilters(){ state.filtersOpen = !state.filtersOpen; commit(); }
function setTheorySearch(v){ state.theorySearch=v; commit(); }
function setTheorySort(v){ state.theorySort=v; commit(); }
function toggleEra(id){
  var opening = state.expandedEra !== id;
  state.expandedEra = (state.expandedEra===id ? null : id);
  state.roadmapFocus=null;
  commit();
  if(opening){
    var el = document.getElementById('rme-'+id);
    if(el && el.scrollIntoView) el.scrollIntoView({block:'nearest', behavior:'smooth'});
  }
}
function toggleWatched(id){
  var was = !!state.watched[id];
  state.watched[id] = !was;
  state.watchedOrder = state.watchedOrder.filter(function(x){ return x!==id; });
  if(!was) state.watchedOrder.unshift(id);
  commit();
}
function displayNameFor(){
  if(!state.user) return 'Fan';
  if(state.displayName) return state.displayName;
  return (state.user.user_metadata && (state.user.user_metadata.full_name || state.user.user_metadata.name)) || state.user.email || 'Fan';
}
function setDisplayNameDraft(v){ state.displayNameDraft=v; commit(); }
function saveDisplayName(){
  var name = state.displayNameDraft.trim();
  if(!name) return;
  state.displayName = name;
  state.displayNameDraft = '';
  commit();
  if(sb && state.user) sb.from('profiles').upsert({user_id:state.user.id, display_name:name}, {onConflict:'user_id'}).then(function(){});
}
function saveItemStat(id){
  if(!sb || !state.user) return;
  sb.from('item_stats').upsert({
    user_id: state.user.id, item_id: id,
    favorite: !!state.favorites[id], rating: state.ratings[id]||null
  }, {onConflict:'user_id,item_id'}).then(function(){});
}
function setRating(id, n){
  if(!requireAuth()) return;
  state.ratings[id] = (state.ratings[id]===n ? 0 : n);
  commit();
  saveItemStat(id);
}
function toggleStoryboard(){ state.showStoryboard = !state.showStoryboard; commit(); }
var toastTimer = null;
function showToast(msg){
  state.toastMsg = msg;
  commit();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ state.toastMsg = null; commit(); }, 3200);
}
function dismissToast(){ clearTimeout(toastTimer); state.toastMsg = null; commit(); }
function toggleFavorite(id){
  if(!requireAuth()) return;
  var was = !!state.favorites[id];
  state.favorites[id] = !was;
  state.favoriteOrder = state.favoriteOrder.filter(function(x){ return x!==id; });

  saveItemStat(id);
  if(!was) showToast('Added to favorites — find it under Progress ▸ Your favorites');
}
function toggleNotif(){ state.notif = !state.notif; commit(); }
function dismissCookieNotice(){ state.cookieNoticeDismissed = true; commit(); }
function dismissFanNotice(){ state.fanNoticeDismissed = true; commit(); }
function showLegal(){ state.showLegal = true; commit(); }
function closeLegal(){ state.showLegal = false; commit(); }
function setLayout(v){ state.layout = v; state.roadmapFocus = null; commit(); }
function focusRoadmapItem(id){
  var was = state.roadmapFocus === id;
  state.roadmapFocus = was ? null : id;
  commit();
  if(!was){
    var el = document.getElementById('rm-'+id);
    if(el && el.scrollIntoView) el.scrollIntoView({block:'nearest', behavior:'smooth'});
  }
}
function setTheme(t){ state.theme = t; document.documentElement.setAttribute('data-app-theme', t); commit(); }
function resetProgress(){ state.watched={}; state.ratings={}; state.watchedOrder=[]; state.favorites={}; state.favoriteOrder=[]; commit(); }

function toggleTheoryOpen(id){ state.theoryOpen[id] = !state.theoryOpen[id]; commit(); }
function vote(id, type){
  if(!requireAuth()) return;
  var current = state.myVote[id];
  var next = type;
  function dec(obj){ obj[id] = Math.max(0, (obj[id]||0)-1); }
  function inc(obj){ obj[id] = (obj[id]||0)+1; }
  if(current === type){ dec(type==='agree'?state.upvotes:state.downvotes); next = null; }
  else{
    if(current) dec(current==='agree'?state.upvotes:state.downvotes);
    inc(type==='agree'?state.upvotes:state.downvotes);
  }
  state.myVote[id] = next;
  commit();
  if(sb){
    if(next===null) sb.from('votes').delete().eq('user_id', state.user.id).eq('theory_id', id).then(function(){});
    else sb.from('votes').upsert({user_id:state.user.id, theory_id:id, vote_type:next}, {onConflict:'user_id,theory_id'}).then(function(){});
  }
}
function setCommentDraft(id, v){ state.commentDrafts[id]=v; commit(); }
function addComment(id){
  if(!requireAuth()) return;
  var text = (state.commentDrafts[id]||'').trim();
  if(!text) return;
  var name = displayNameFor();
  state.remoteComments[id] = (state.remoteComments[id]||[]).concat([{theory_id:id, body:text, user_name:name, user_id:state.user.id}]);
  state.commentDrafts[id] = '';
  commit();
  if(sb) sb.from('comments').insert({theory_id:id, body:text, user_name:name, user_id:state.user.id}).then(function(){ loadRemoteData(); });
}
function deleteComment(id, idx){
  var list = state.remoteComments[id]||[];
  var c = list[idx];
  state.remoteComments[id] = list.filter(function(_,i){ return i!==idx; });
  commit();
  if(sb && c && c.id) sb.from('comments').delete().eq('id', c.id).then(function(){});
}
function deleteTheory(id){
  state.userTheories = state.userTheories.filter(function(t){ return t.id!==id; });
  commit();
  if(sb) sb.from('user_theories').delete().eq('id', id).then(function(){});
}
function toggleNewTheoryForm(){
  if(!requireAuth()) return;
  state.showNewTheory = !state.showNewTheory;
  commit();
}
function setNewTheoryTitle(v){ state.newTheoryTitle=v; commit(); }
function setNewTheoryBody(v){ state.newTheoryBody=v; commit(); }
function submitTheory(){
  if(!requireAuth()) return;
  var title = state.newTheoryTitle.trim(), body = state.newTheoryBody.trim();
  if(!title || !body) return;
  var name = displayNameFor();
  state.newTheoryTitle=''; state.newTheoryBody=''; state.showNewTheory=false;
  commit();
  if(sb) sb.from('user_theories').insert({title:title, body:body, user_name:name, user_id:state.user.id}).then(function(){ loadRemoteData(); });
}

/* ---------- derived data helpers ---------- */
function filteredEras(s){
  var q = s.search.trim().toLowerCase();
  var sourceEras;
  if(s.viewMode === 'doomsday'){
    var items = DOOMSDAY_PATH.map(function(id){ return ALL_ITEMS.find(function(it){ return it.id===id; }); }).filter(Boolean);
    sourceEras = [{id:'doomsday-path', name:'Path to Doomsday', years:'Curated multiverse build-up', blurb:"A hand-picked route through only the titles that build directly toward Avengers: Doomsday — skipping side stories so the multiverse threat's escalation reads as one continuous line.", items:items}];
  } else if(s.viewMode === 'release'){
    var base = s.section === 'other' ? OTHER_ERAS : RAW_ERAS;
    var flat = [];
    base.forEach(function(e){ e.items.forEach(function(it){ flat.push(it); }); });
    flat.sort(function(a,b){ return a.year-b.year; });
    sourceEras = [{id:'by-release', name:'By Release Year', years:'', blurb:"The order these actually came out in theaters and on Disney+ — useful if you want to see the story the way the writers built it, twists and retcons included, rather than smoothed into in-universe order.", items:flat}];
  } else {
    sourceEras = s.section === 'other' ? OTHER_ERAS : RAW_ERAS;
  }
  return sourceEras.map(function(era){
    var items = era.items.filter(function(it){ return !q || it.title.toLowerCase().indexOf(q) !== -1; });
    var eraWatched = era.items.filter(function(it){ return s.watched[it.id]; }).length;
    var collapsible = s.viewMode === 'chrono';
    var expanded = collapsible ? (s.expandedEra===era.id || !!q) : true;
    return {
      id: era.id, name: era.name, years: era.years, blurb: era.blurb||'', items: items,
      expanded: expanded, collapsible: collapsible,
      chevron: collapsible ? (expanded ? '▾' : '▸') : '',
      progressLabel: eraWatched + '/' + era.items.length
    };
  }).filter(function(era){ return era.items.length > 0 || !q; });
}

/* ---------- render: timeline ---------- */
function renderItem(it, s){
  var watched = !!s.watched[it.id];
  var favorite = !!s.favorites[it.id];
  var rating = s.ratings[it.id] || 0;
  var stars = '';
  if(watched){
    var starEls = '';
    for(var n=1;n<=5;n++){
      starEls += '<button type="button" class="star '+(n<=rating?'is-on':'')+'" data-act="setRating" data-id="'+esc(it.id)+'" data-n="'+n+'">★</button>';
    }
    stars = '<div class="rating"><span class="rating-label">Your rating</span><div class="stars">'+starEls+'</div></div>';
  }
  var scoresBlock;
  if(it.upcoming){
    scoresBlock = '<div class="item-scores"><span class="score-chip is-upcoming">UPCOMING · '+esc(it.releaseDate||'TBA')+'</span></div>';
  } else {
    var critic = it.critic != null ? it.critic : 65;
    var fan = fanScoreFor(it.id, critic).toFixed(1);
    var criticCls = critic>=75 ? 'is-hot' : (critic>=45 ? '' : 'is-cold');
    scoresBlock = '<div class="item-scores"><span class="score-chip '+criticCls+'">CRITICS '+critic+'%</span><span class="score-chip">FANS '+fan+'/5</span></div>';
  }
  return (
    '<div class="item">'+
      '<button type="button" class="item-check '+(watched?'is-on':'')+'" data-act="toggleWatched" data-id="'+esc(it.id)+'" aria-label="Mark '+esc(it.title)+' as watched">'+(watched?'✓':'')+'</button>'+
      '<div class="item-body">'+
        '<div class="item-tags">'+
          '<span class="tag-type tag-'+TYPE_TAG[it.type].replace('tag-','')+'">'+TYPE_LABEL[it.type]+'</span>'+
          '<h4 class="item-title">'+esc(it.title)+'</h4>'+
          '<button type="button" class="fav-btn '+(favorite?'is-on':'')+'" data-act="toggleFavorite" data-id="'+esc(it.id)+'" aria-label="'+(favorite?'Remove '+esc(it.title)+' from favorites':'Add '+esc(it.title)+' to favorites')+'">'+(favorite?'♥':'♡')+'</button>'+
        '</div>'+
        '<div class="item-meta">'+it.year+' · '+esc(it.runtime)+'</div>'+
        scoresBlock+
        '<p class="item-synopsis">'+esc(it.synopsis)+'</p>'+
        stars+
      '</div>'+
    '</div>'
  );
}
function renderEra(era){
  var head = era.collapsible
    ? '<button type="button" class="era-head" data-act="toggleEra" data-id="'+esc(era.id)+'">'+
        '<div><h3 class="era-name">'+esc(era.name)+'</h3><div class="era-years">'+esc(era.years)+'</div></div>'+
        '<div class="era-meta"><span class="chip">'+era.progressLabel+'</span><span class="chevron">'+era.chevron+'</span></div>'+
      '</button>'
    : '<div class="era-head" data-static="1">'+
        '<div><h3 class="era-name">'+esc(era.name)+'</h3><div class="era-years">'+esc(era.years)+'</div></div>'+
        '<div class="era-meta"><span class="chip">'+era.progressLabel+'</span></div>'+
      '</div>';
  var blurb = era.blurb ? '<p class="era-blurb">'+esc(era.blurb)+'</p>' : '';
  var items = era.expanded ? era.items.map(function(it){ return renderItem(it, state); }).join('') : '';
  return '<div class="era">'+head+blurb+items+'</div>';
}

      var starEls = '';
      for(var n=1;n<=5;n++){

      }
      stars = '<div class="rating" style="margin-top:6px"><span class="rating-label">Your rating</span><div class="stars">'+starEls+'</div></div>';
    }
    var scoresBlock;
    if(it.upcoming){
      scoresBlock = '<div class="item-scores"><span class="score-chip is-upcoming">UPCOMING · '+esc(it.releaseDate||'TBA')+'</span></div>';
    } else {
      var critic = it.critic != null ? it.critic : 65;
      var fan = fanScoreFor(it.id, critic).toFixed(1);
      var criticCls = critic>=75 ? 'is-hot' : (critic>=45 ? '' : 'is-cold');
      scoresBlock = '<div class="item-scores"><span class="score-chip '+criticCls+'">CRITICS '+critic+'%</span><span class="score-chip">FANS '+fan+'/5</span></div>';

function renderRoadmapEra(era, s){
  var dimmed = s.roadmapFocus && !era.items.some(function(it){ return it.id === s.roadmapFocus; });
  var head = era.collapsible
    ? '<button type="button" class="roadmap-era-head" data-act="toggleEra" data-id="'+esc(era.id)+'">'+
        '<div class="roadmap-era-dot"></div>'+
        '<div class="roadmap-era-top"><h3 class="roadmap-era-name">'+esc(era.name)+' <span class="chevron">'+era.chevron+'</span></h3><span class="roadmap-era-years">'+esc(era.years)+' · '+era.progressLabel+'</span></div>'+
        (era.blurb&&!s.roadmapFocus?'<p class="roadmap-era-blurb">'+esc(era.blurb)+'</p>':'')+
      '</button>'
    : '<div class="roadmap-era-head" data-static="1">'+
        '<div class="roadmap-era-dot"></div>'+
        '<div class="roadmap-era-top"><h3 class="roadmap-era-name">'+esc(era.name)+'</h3><span class="roadmap-era-years">'+esc(era.years)+' · '+era.progressLabel+'</span></div>'+
        (era.blurb&&!s.roadmapFocus?'<p class="roadmap-era-blurb">'+esc(era.blurb)+'</p>':'')+
      '</div>';
  var sectionDimmed = s.expandedEra && era.collapsible && s.expandedEra !== era.id;
  var sectionZoomed = s.expandedEra && era.collapsible && s.expandedEra === era.id;
  var items = era.expanded ? era.items.map(function(it){ return renderRoadmapItem(it, s, s.roadmapMarkers ? s.roadmapMarkers[it.id] : null); }).join('') : '';
  return '<div class="roadmap-era'+(dimmed||sectionDimmed?' is-dimmed':'')+(sectionZoomed?' is-zoomed':'')+'" id="rme-'+esc(era.id)+'">'+head+items+'</div>';
}
function renderTimeline(s){
  var eras = filteredEras(s);
  if(!eras.length){
    return '<div class="tab-panel"><p class="empty-note">No titles match &ldquo;'+esc(s.search)+'&rdquo;.</p></div>';
  }
  if(s.layout === 'roadmap'){
    var flatIds = [];
    eras.forEach(function(era){ era.items.forEach(function(it){ flatIds.push(it.id); }); });
    var markers = {};
    if(flatIds.length){
      if(s.viewMode === 'doomsday'){
        markers[flatIds[0]] = 'start';
        markers[flatIds[flatIds.length-1]] = 'finish';
      }
      var nextUnwatched = flatIds.find(function(id){ return !s.watched[id]; });
      if(nextUnwatched && !markers[nextUnwatched]) markers[nextUnwatched] = 'here';
    }
    s.roadmapMarkers = markers;
    var zoomBar = s.roadmapFocus ? '<button type="button" class="zoom-out-bar" data-act="focusRoadmapItem" data-id="'+esc(s.roadmapFocus)+'">⤢ Zoom out to full timeline</button>' :
      (s.expandedEra ? '<button type="button" class="zoom-out-bar" data-act="toggleEra" data-id="'+esc(s.expandedEra)+'">⤢ Zoom out to full timeline</button>' : '');
    return '<div class="tab-panel"><div class="roadmap-poster"><h6 class="roadmap-poster-eyebrow">Avengers, Assemble</h6><h2 class="roadmap-poster-title">You will get there</h2></div>'+zoomBar+'<div class="roadmap'+(s.roadmapFocus?' has-focus':'')+'"><div class="roadmap-line"></div>'+eras.map(function(era){ return renderRoadmapEra(era, s); }).join('')+'</div></div>';
  }
  return '<div class="tab-panel">'+eras.map(renderEra).join('')+'</div>';
}

      cards+

function renderHomeHeader(){
  return '<h6 class="eyebrow">Your Progress</h6><h1 class="title">Rewatch</h1>';
}
function renderHome(s){
  var totalMin=0, watchedMin=0, totalCount=0, watchedCount=0;
  ALL_ITEMS_CONNECTED().forEach(function(it){
    totalMin += it.min; totalCount++;
    if(s.watched[it.id]){ watchedMin += it.min; watchedCount++; }
  });
  var pct = totalCount ? Math.round(watchedCount/totalCount*100) : 0;
  var perEra = RAW_ERAS.map(function(era){
    var w = era.items.filter(function(it){ return s.watched[it.id]; }).length;
    var t = era.items.length;
    return {name:era.name, w:w, t:t, pctWidth: t ? Math.round(w/t*100)+'%' : '0%'};
  });
  var recent = s.watchedOrder.slice(0,5).map(function(id){
    var it = ALL_ITEMS.find(function(x){ return x.id===id; });
    return it ? {title:it.title, year:it.year} : null;
  }).filter(Boolean);

  var eraBars = perEra.map(function(pe){
    return '<div class="era-progress"><div class="era-progress-row"><span>'+esc(pe.name)+'</span><span>'+pe.w+'/'+pe.t+'</span></div>'+
      '<div class="era-progress-track"><div class="era-progress-fill" style="width:'+pe.pctWidth+'"></div></div></div>';
  }).join('');

  var recentBlock = recent.length
    ? recent.map(function(r){ return '<div class="recent-row"><span>'+esc(r.title)+'</span><span class="recent-year">'+r.year+'</span></div>'; }).join('')
    : '<p class="empty-note">Nothing watched yet — check off a title in the Timeline tab.</p>';

  var favorites = s.favoriteOrder.map(function(id){
    var it = ALL_ITEMS.find(function(x){ return x.id===id; });
    return it ? {id:it.id, title:it.title, year:it.year, type:it.type} : null;
  }).filter(Boolean);
  var favoritesBlock = favorites.length
    ? '<button type="button" class="filters-toggle" style="margin-bottom:10px" data-act="toggleStoryboard">'+(s.showStoryboard?'Hide storyboard ▾':'View as storyboard ▸')+'</button>'+
      (s.showStoryboard ? renderStoryboard(s) : favorites.map(function(f){
        return '<div class="recent-row favorite-row"><span><span class="tag-type tag-'+TYPE_TAG[f.type].replace('tag-','')+'" style="margin-right:8px">'+TYPE_LABEL[f.type]+'</span>'+esc(f.title)+'</span><span class="recent-year">'+f.year+'</span></div>';
      }).join(''))
    : '<p class="empty-note">No favorites yet — tap the heart on any title in the Timeline tab.</p>';

  var upcoming = ALL_ITEMS.filter(function(it){ return it.upcoming; });
  var nextBlock = upcoming.length
    ? '<div class="next-release">'+upcoming.map(function(it){
        return '<div class="next-release-row"><div><div class="next-release-title">'+esc(it.title)+'</div>'+
          '<div class="next-release-type">'+TYPE_LABEL[it.type]+'</div></div>'+
          '<span class="next-release-date">'+esc(it.releaseDate||'TBA')+'</span></div>';
      }).join('')+'</div>'
    : '';
  var nextSection = upcoming.length ? ('<h6 class="section-label">Next release</h6>'+nextBlock) : '';

  return (
    '<div class="tab-panel">'+
      '<div class="stat-row"><div class="stat-pct">'+pct+'%</div><div class="stat-sub">watched<br>'+watchedCount+' of '+totalCount+' titles</div></div>'+
      '<p class="stat-caption">'+fmtMin(watchedMin)+' watched · '+fmtMin(totalMin-watchedMin)+' left</p>'+
      nextSection+
      '<h6 class="section-label">Your favorites</h6>'+favoritesBlock+
      '<h6 class="section-label">Progress by era</h6>'+eraBars+
      '<h6 class="section-label">Recently watched</h6>'+recentBlock+
    '</div>'
  );
}
function ALL_ITEMS_CONNECTED(){ return RAW_ERAS.reduce(function(a,e){ return a.concat(e.items); }, []); }

/* ---------- render: theories ---------- */
function renderTheoriesHeader(s){
  return (
    '<h6 class="eyebrow">Speculation</h6><h1 class="title">Fan Theories</h1>'+
    '<p class="caption">Community hypotheses, including current chatter on Doomsday and Secret Wars — unconfirmed, for fun.</p>'+
    '<input class="search" type="text" placeholder="Search theories…" value="'+esc(s.theorySearch)+'" data-bind="theorySearch" data-focus-id="theory-search">'+
    '<div class="seg" style="margin-top:8px">'+
      '<label><input type="radio" name="theorysort" data-value="new" '+(s.theorySort!=='buzz'?'checked':'')+'>Newest</label>'+
      '<label><input type="radio" name="theorysort" data-value="buzz" '+(s.theorySort==='buzz'?'checked':'')+'>Most Buzz</label>'+
    '</div>'
  );
}
function renderTheories(s){
  var q = s.theorySearch.trim().toLowerCase();
  var list = s.userTheories.concat(ALL_THEORIES);
  if(q){
    list = list.filter(function(t){
      return t.title.toLowerCase().indexOf(q)!==-1 || t.body.toLowerCase().indexOf(q)!==-1;
    });
  }
  if(s.theorySort === 'buzz'){
    list = list.slice().sort(function(a,b){ return b.heat - a.heat; });
  }
  var form = s.showNewTheory
    ? '<div class="theory-form" data-act="stop">'+
        '<input class="field-input" type="text" placeholder="Theory title" value="'+esc(s.newTheoryTitle)+'" data-bind="theoryTitle" data-focus-id="theory-title">'+
        '<textarea class="field-textarea" placeholder="Explain your theory…" data-bind="theoryBody" data-focus-id="theory-body">'+esc(s.newTheoryBody)+'</textarea>'+
        '<button type="button" class="btn btn-primary" data-act="submitTheory">Post theory</button>'+
      '</div>'
    : '';
  var items = list.map(function(t){
    var open = !!s.theoryOpen[t.id];
    var heatDots = '';
    for(var n=1;n<=4;n++){ heatDots += '<span class="heat-dot '+(n<=t.heat?'is-on':'')+'"></span>'; }
    var mineTag = t.mine
      ? '<span class="tag-mine">YOURS</span><span class="delete-link" data-act="deleteTheory" data-id="'+esc(t.id)+'">✕ Delete</span>'
      : '';
    var openBlock = '';
    if(open){
      var comments = (s.remoteComments[t.id]||[]);
      var commentsHtml = comments.map(function(c, idx){
        var mine = s.user && c.user_id === s.user.id;
        return '<div class="comment-row"><span><strong>'+esc(c.user_name||'Fan')+':</strong> '+esc(c.body)+'</span>'+(mine?'<span class="delete-link" data-act="deleteComment" data-id="'+esc(t.id)+'" data-idx="'+idx+'">✕</span>':'')+'</div>';
      }).join('') || '<p class="empty-note" style="padding:8px 0">No comments yet — be the first.</p>';
      var draft = s.commentDrafts[t.id] || '';
      var agree = s.myVote[t.id] === 'agree', disagree = s.myVote[t.id] === 'disagree';
      var sourceLine = t.source ? '<p class="theory-source">via '+esc(t.source)+'</p>' : '';
      openBlock =
        '<p class="theory-body">'+esc(t.body)+'</p>'+
        sourceLine+
        '<div class="vote-row">'+
          '<button type="button" class="vote-btn '+(agree?'is-on':'')+'" data-act="vote" data-id="'+esc(t.id)+'" data-type="agree">▲ Agree <span>'+(s.upvotes[t.id]||0)+'</span></button>'+
          '<button type="button" class="vote-btn '+(disagree?'is-on':'')+'" data-act="vote" data-id="'+esc(t.id)+'" data-type="disagree">▼ Disagree <span>'+(s.downvotes[t.id]||0)+'</span></button>'+
        '</div>'+
        '<div class="comments-block">'+commentsHtml+
          '<div class="comment-input-row" data-act="stop">'+
            '<input class="field-input comment-input" type="text" placeholder="Add a comment…" value="'+esc(draft)+'" data-bind="comment:'+esc(t.id)+'" data-focus-id="comment-'+esc(t.id)+'">'+
            '<button type="button" class="btn comment-post" data-act="addComment" data-id="'+esc(t.id)+'">Post</button>'+
          '</div>'+
        '</div>';
    }
    return (
      '<div class="theory" data-act="toggleTheoryOpen" data-id="'+esc(t.id)+'">'+
        '<div class="theory-head">'+
          '<div class="theory-title-row"><h4 class="theory-title">'+esc(t.title)+'</h4>'+mineTag+'</div>'+
          '<span class="theory-chevron">'+(open?'▾':'▸')+'</span>'+
        '</div>'+
        '<div class="heat-row"><span class="heat-label">Buzz</span><div class="heat-dots">'+heatDots+'</div></div>'+
        openBlock+
      '</div>'
    );
  }).join('');

  if(list.length === 0){
    items = '<p class="empty-note">No theories match &ldquo;'+esc(s.theorySearch)+'&rdquo;.</p>';
  }

  return (
    '<div class="tab-panel">'+
      '<button type="button" class="btn '+(s.showNewTheory?'':'btn-primary')+'" style="margin:4px 0" data-act="toggleNewTheoryForm">'+(s.showNewTheory?'Cancel':'+ Submit your own theory')+'</button>'+
      form+items+
    '</div>'
  );
}

/* ---------- render: settings ---------- */
function renderSettingsHeader(){
  return '<h1 class="title">Settings</h1>';
}

    ? '<div class="pref-row"><span class="pref-label">Signed in as '+esc(displayNameFor())+'</span>'+

        '</div>'+
      '</div>'

  return (
    '<div class="tab-panel">'+
      '<h6 class="section-label" style="margin-top:8px">Account</h6>'+
      accountBlock+
      '<h6 class="section-label">Preferences</h6>'+
      '<div class="pref-row"><span class="pref-label">Notifications for new releases</span>'+
        '<div class="switch '+(s.notif?'is-on':'')+'" data-act="toggleNotif"><div class="switch-knob"></div></div></div>'+
      '<div class="pref-row"><span class="pref-label">Timeline layout</span>'+
        '<div class="seg" style="width:auto">'+
          '<label style="padding:6px 14px"><input type="radio" name="layout" data-value="list" '+(s.layout!=='roadmap'?'checked':'')+'>List</label>'+
          '<label style="padding:6px 14px"><input type="radio" name="layout" data-value="roadmap" '+(s.layout==='roadmap'?'checked':'')+'>Roadmap</label>'+
        '</div></div>'+
      '<div class="theme-row"><span class="pref-label">Appearance</span>'+
        '<p class="caption" style="margin:2px 0 8px">Pick a hero palette.</p>'+
        '<div class="theme-options">'+
          THEMES.map(function(th){
            return '<button type="button" class="theme-swatch '+(s.theme===th.id?'is-on':'')+'" data-act="setTheme" data-theme="'+th.id+'">'+
              '<span class="swatch-dots">'+th.dots.map(function(c){ return '<span class="swatch-dot" style="background:'+c+'"></span>'; }).join('')+'</span>'+
              '<span class="swatch-name">'+esc(th.name)+'</span><span class="swatch-desc">'+esc(th.desc)+'</span>'+
            '</button>';
          }).join('')+
        '</div>'+
      '</div>'+
      '<h6 class="section-label">Data</h6>'+
      '<div style="padding:12px 0;border-top:1px solid var(--divider)">'+
        '<button type="button" class="btn btn-danger" data-act="resetProgress">Reset all progress</button>'+
      '</div>'+
      '<h6 class="section-label">About</h6>'+
      '<p class="about-text">Marvel for Dummies is a companion for rewatching the MCU in story order — every film, series, special and short, grouped by era. Your progress, ratings and theories are saved on this device.</p>'+
      '<p class="about-text" style="opacity:.7;font-size:11.5px">All character names, titles and likenesses belong to Marvel/Disney and their respective rights holders. This is an unofficial, non-commercial fan project.</p>'+
      '<button type="button" class="filters-toggle" style="margin:2px 0 12px" data-act="showLegal">Privacy &amp; Legal ▸</button>'+
    '</div>'
  );
}

/* ---------- shell ---------- */
var TABS = [
  {id:'timeline', label:'Timeline'},
  {id:'home', label:'Progress'},
  {id:'theories', label:'Theories'},
  {id:'settings', label:'Settings'}
];
function renderTabbar(s){
  return '<nav class="tabbar">'+TABS.map(function(t){
    return '<button type="button" class="tab-btn '+(s.tab===t.id?'is-on':'')+'" data-act="setTab" data-id="'+t.id+'">'+ICONS[t.id]+'<span>'+t.label+'</span></button>';
  }).join('')+'</nav>';
}
function template(s){
  var header, content;
  if(s.tab==='timeline'){ header = renderTimelineHeader(s); content = renderTimeline(s); }
  else if(s.tab==='home'){ header = renderHomeHeader(); content = renderHome(s); }
  else if(s.tab==='theories'){ header = renderTheoriesHeader(s); content = renderTheories(s); }
  else { header = renderSettingsHeader(); content = renderSettings(s); }
  var cookieBanner = s.cookieNoticeDismissed ? '' :
    '<div class="cookie-banner">'+
      '<p>This app saves your watch progress, ratings and favorites locally on your device (no tracking cookies, nothing sent to a server). See <a href="#" data-act="showLegal">Privacy &amp; Legal</a>.</p>'+
      '<button type="button" class="cookie-ok" data-act="dismissCookieNotice">Got it</button>'+
    '</div>';
  var accountPill = s.user
    ? '<button type="button" class="account-pill" data-act="setTab" data-id="settings" title="'+esc(displayNameFor())+'"><span class="account-avatar">'+esc((displayNameFor()||'?').charAt(0).toUpperCase())+'</span></button>'
    : '<button type="button" class="account-pill account-pill-out" data-act="signIn">Sign in</button>';
  return (
    accountPill+
    '<header class="app-header'+(s.scrolled?' is-collapsed':'')+'"><div class="tab-panel">'+header+'</div></header>'+
    '<main class="app-content">'+content+'</main>'+
    renderTabbar(s)+
    cookieBanner+
    (s.showLegal ? renderLegalModal() : '')+
    (s.authPrompt ? renderAuthModal() : '')+
    (s.toastMsg ? '<div class="toast" data-act="dismissToast">'+esc(s.toastMsg)+'</div>' : '')+
    (!s.fanNoticeDismissed ? renderFanNoticeModal() : '')
  );
}
function renderAuthModal(){
  return (
    '<div class="legal-modal" data-act="dismissAuthPrompt">'+
      '<div class="legal-card" data-act="stop">'+
        '<h3>Sign in to join in</h3>'+
        '<p>Voting, rating, favoriting and posting theories or comments need an account, so everyone sees the same shared list instead of a copy stuck on one phone.</p>'+
        '<button type="button" class="btn btn-primary" data-act="signIn" style="margin-bottom:10px">Continue with Google</button>'+
        '<button type="button" class="zoom-out-link" data-act="dismissAuthPrompt">Not now</button>'+
      '</div>'+
    '</div>'
  );
}
function renderFanNoticeModal(){
  return (
    '<div class="legal-modal" data-act="dismissFanNotice">'+
      '<div class="legal-card" data-act="stop">'+
        '<h3>Just so you know</h3>'+
        '<p><strong>Marvel for Dummies is an unofficial fan project</strong> — built by a fan, for fans. It isn\'t made, endorsed, or affiliated with Marvel, Disney, or any of the studios behind these movies and shows.</p>'+
        '<p>All character names, titles, artwork and likenesses belong to their respective rights holders. This app just helps you track and talk about them.</p>'+
        '<button type="button" class="btn btn-primary" data-act="dismissFanNotice">Got it</button>'+
      '</div>'+
    '</div>'
  );
}
function renderLegalModal(){
  return (
    '<div class="legal-modal" data-act="closeLegal">'+
      '<div class="legal-card" data-act="stop">'+
        '<h3>Privacy &amp; Legal</h3>'+
        '<p><strong>What this app stores:</strong> your watched titles, ratings, favorites and settings are saved only in your browser\'s local storage on this device. Nothing is uploaded, no account is required, and no analytics or tracking cookies are used.</p>'+
        '<p><strong>Clearing your data:</strong> use Settings → Reset all progress, or clear this site\'s data in your browser to remove everything.</p>'+
        '<p><strong>Third-party content:</strong> synopses and scores are editorial summaries for personal reference; all titles, names and imagery referenced belong to their respective rights holders. This is an unofficial fan companion, not affiliated with Marvel or Disney.</p>'+
        '<button type="button" class="zoom-out-link" data-act="closeLegal">Close</button>'+
      '</div>'+
    '</div>'
  );
}

/* ---------- render loop with focus + scroll preservation ---------- */
var root = document.getElementById('app');
function render(){
  document.documentElement.setAttribute('data-app-theme', state.theme);
  var active = document.activeElement;
  var focusId = (active && active.dataset) ? active.dataset.focusId : null;
  var selStart = null, selEnd = null;
  if(active && typeof active.selectionStart === 'number'){ selStart = active.selectionStart; selEnd = active.selectionEnd; }
  var oldContent = root.querySelector('.app-content');
  var oldScrollTop = oldContent ? oldContent.scrollTop : 0;
  root.innerHTML = template(state);
  var newContent = root.querySelector('.app-content');
  if(newContent) newContent.scrollTop = oldScrollTop;
  if(focusId){
    var el = root.querySelector('[data-focus-id="'+focusId+'"]');
    if(el){
      el.focus({preventScroll:true});
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

/* ---------- event delegation ---------- */
root.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el) return;
  if(el.tagName === 'A') e.preventDefault();
  var act = el.dataset.act, id = el.dataset.id;
  switch(act){
    case 'stop': break;
    case 'dismissCookieNotice': dismissCookieNotice(); break;
    case 'showLegal': showLegal(); break;
    case 'closeLegal': closeLegal(); break;
    case 'signIn': signInWithGoogle(); break;
    case 'signOut': signOut(); break;
    case 'dismissAuthPrompt': dismissAuthPrompt(); break;
    case 'dismissFanNotice': dismissFanNotice(); break;
    case 'setTab': setTab(id); break;
    case 'toggleFilters': toggleFilters(); break;
    case 'focusRoadmapItem': focusRoadmapItem(id); break;
    case 'toggleEra': toggleEra(id); break;
    case 'toggleWatched': toggleWatched(id); break;
    case 'toggleFavorite': toggleFavorite(id); break;
    case 'toggleStoryboard': toggleStoryboard(); break;
    case 'saveDisplayName': saveDisplayName(); break;
    case 'dismissToast': dismissToast(); break;
    case 'setRating': setRating(id, Number(el.dataset.n)); break;
    case 'toggleTheoryOpen': toggleTheoryOpen(id); break;
    case 'vote': vote(id, el.dataset.type); break;
    case 'deleteComment': deleteComment(id, Number(el.dataset.idx)); break;
    case 'deleteTheory': deleteTheory(id); break;
    case 'toggleNewTheoryForm': toggleNewTheoryForm(); break;
    case 'submitTheory': submitTheory(); break;
    case 'addComment': addComment(id); break;
    case 'toggleNotif': toggleNotif(); break;
    case 'setTheme': setTheme(el.dataset.theme); break;
    case 'resetProgress':
      if(window.confirm('Reset all watched progress and ratings? This can’t be undone.')) resetProgress();
      break;
  }
});
root.addEventListener('change', function(e){
  var t = e.target;
  if(t.name === 'viewmode'){ setViewMode(t.dataset.value); }
  else if(t.name === 'section'){ setSection(t.dataset.value); }
  else if(t.name === 'theorysort'){ setTheorySort(t.dataset.value); }
  else if(t.name === 'layout'){ setLayout(t.dataset.value); }
});
root.addEventListener('input', function(e){
  var t = e.target;
  var bind = t.dataset.bind;
  if(!bind) return;
  if(bind === 'search'){ setSearch(t.value); }
  else if(bind === 'theorySearch'){ setTheorySearch(t.value); }
  else if(bind === 'theoryTitle'){ setNewTheoryTitle(t.value); }
  else if(bind === 'theoryBody'){ setNewTheoryBody(t.value); }
  else if(bind.indexOf('comment:') === 0){ setCommentDraft(bind.slice(8), t.value); }
  else if(bind === 'displayName'){ setDisplayNameDraft(t.value); }
});
/* 'scroll' doesn't bubble, so listen on the capture phase to catch it from .app-content */
root.addEventListener('scroll', function(e){
  if(!e.target.classList || !e.target.classList.contains('app-content')) return;
  var st = e.target.scrollTop;
  if(st > 24 && !state.scrolled){ state.scrolled = true; commit(); }
  else if(st <= 2 && state.scrolled){ state.scrolled = false; commit(); }
}, true);

render();
showSplash();
initAuth();
window.addEventListener('pageshow', function(e){
  if(e.persisted && sb){
    sb.auth.getSession().then(function(res){
      var nextUser = res.data.session ? res.data.session.user : null;
      if((state.user && nextUser && state.user.id !== nextUser.id) || (!!state.user) !== (!!nextUser)){
        state.user = nextUser;
        loadRemoteData();
      }
    });
  }
});

/* ---------- opening transition ---------- */
function showSplash(){
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced) return;
  var el = document.createElement('div');
  el.className = 'app-splash';
  el.setAttribute('aria-hidden', 'true');
  el.innerHTML =
    '<div class="app-splash-inner">'+
      '<div class="app-splash-flash"></div>'+
      '<div class="app-splash-word">Marvel</div>'+
      '<div class="app-splash-kicker">For Dummies</div>'+
    '</div>';
  document.body.appendChild(el);
  setTimeout(function(){
    el.classList.add('is-leaving');
    setTimeout(function(){ el.remove(); }, 500);
  }, 1600);
}
</script>
