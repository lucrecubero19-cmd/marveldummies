*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg-deep); color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
::selection{background:var(--accent-soft)}
button,input,textarea{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{
  max-width:560px; margin:0 auto; height:100vh; height:100dvh;
  background:var(--bg); display:flex; flex-direction:column; position:relative;
  transition:background .25s ease, color .25s ease;
}
@media (min-width:900px){
  html, body{ background:var(--bg); }
  #app{
    max-width:none; width:100%; height:100dvh; margin:0; border-radius:0; box-shadow:none;
  }
  .app-header .tab-panel, .app-content > .tab-panel{ max-width:820px; margin:0 auto; }
  .tabbar{ max-width:900px; margin:0 auto; }
}

.account-pill{ position:absolute; top:calc(env(safe-area-inset-top) + 22px + clamp(20px,7.6vw,40px) * 1.15); right:20px; transform:translateY(-50%); z-index:3; border:0; padding:0; background:none; cursor:pointer; }
.account-avatar{ display:flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:50%; background:var(--accent); color:var(--bg); font-family:var(--font-heading); font-weight:400; font-size:15px; }
.account-pill-out{ font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-weight:700; font-size:12px; padding:7px 12px; border-radius:20px; background:var(--surface); border:1px solid var(--divider) !important; color:var(--text); }

/* ---------- header ---------- */
.app-header{ flex:none; position:relative; padding:calc(env(safe-area-inset-top) + 22px) 20px 16px; overflow:hidden; max-height:600px; transition:max-height .25s ease, opacity .2s ease, padding-bottom .25s ease; }
.app-header.is-collapsed{ max-height:0; opacity:0; padding-bottom:0; }
.app-header::after{
  content:''; position:absolute; left:20px; right:20px; bottom:0; height:1px;
  border-bottom:2px dotted currentColor; opacity:.25; color:var(--text); pointer-events:none;
}
.eyebrow{ font-family:var(--font-heading); font-weight:400; font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); margin:0 0 4px; }
.brand-title{ font-family:var(--font-heading); font-weight:400; font-size:clamp(20px,7.6vw,40px); letter-spacing:-0.02em; text-transform:uppercase; color:var(--accent); text-align:center; white-space:nowrap; margin:0 auto 4px; max-width:calc(100% - 108px); overflow:hidden; text-overflow:ellipsis; }
.brand-sub{ font-family:var(--font-heading); font-weight:400; font-size:28px; margin:0 0 10px; text-align:center; text-wrap:balance; }
.title{ font-family:var(--font-heading); font-weight:400; font-size:29px; line-height:1.06; margin:0; text-wrap:balance; }
.caption{ font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-size:11.5px; color:var(--text-dim); margin:8px 0 0; }
.filters-toggle{ display:inline-block; margin-top:10px; padding:0; border:0; background:none; font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-size:12px; font-weight:600; color:var(--text-dim); cursor:pointer; }
.filters-toggle:active{ color:var(--accent) }

.search{ width:100%; margin-top:14px; padding:10px 12px; font-size:14px; background:var(--surface-2); border:1px solid var(--divider); border-radius:var(--card-radius); color:var(--text); }
.search::placeholder{ color:var(--text-faint) }

.seg{ display:flex; margin-top:12px; border:1px solid var(--divider); border-radius:var(--card-radius); overflow:hidden; }
.seg label{ position:relative; flex:1; text-align:center; padding:8px 4px; font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-size:11.5px; font-weight:700; letter-spacing:.01em; cursor:pointer; color:var(--text-dim); }
.seg label+label{ border-left:1px solid var(--divider) }
.seg input{ position:absolute; opacity:0; width:0; height:0; pointer-events:none; }
.seg label:has(input:checked){ background:var(--accent); color:var(--accent-ink); }
.seg label:has(input:focus-visible){ outline:2px solid var(--accent); outline-offset:-2px; }

/* ---------- content ---------- */
.app-content{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:2px 20px 28px; scrollbar-width:none; }
.cookie-banner{ position:absolute; left:10px; right:10px; bottom:calc(env(safe-area-inset-bottom) + 78px); z-index:5; display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:var(--card-radius); background:var(--surface); border:1px solid var(--divider); box-shadow:0 8px 24px rgba(0,0,0,.28); animation:fadeSlide .25s ease both; }
.cookie-banner p{ margin:0; font-size:12px; line-height:1.4; color:var(--text-dim); flex:1; }
.cookie-banner a{ color:var(--accent); }
.cookie-ok{ flex:none; font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-weight:700; font-size:12px; padding:8px 12px; border-radius:var(--card-radius); border:0; background:var(--accent); color:var(--bg); cursor:pointer; }
.legal-modal{ position:absolute; inset:0; z-index:6; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; }
.legal-card{ width:100%; max-height:80%; overflow-y:auto; padding:20px 20px calc(env(safe-area-inset-bottom) + 20px); border-radius:18px 18px 0 0; background:var(--surface); border:1px solid var(--divider); border-bottom:0; }
.toast{ position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom) + 78px); transform:translateX(-50%); z-index:7; max-width:calc(100% - 40px); padding:11px 16px; border-radius:24px; background:var(--text); color:var(--bg); font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-size:12.5px; font-weight:600; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.3); cursor:pointer; animation:toastIn .25s cubic-bezier(.2,.9,.3,1) both; }
@keyframes toastIn{ from{ opacity:0; transform:translateX(-50%) translateY(8px); } to{ opacity:1; transform:translateX(-50%) translateY(0); } }
.legal-card h3{ font-family:var(--font-heading); font-weight:400; font-size:20px; margin:0 0 10px; }
.legal-subhead{ font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin:16px 0 6px; }
.legal-subhead:first-of-type{ margin-top:4px; }
.legal-card a{ color:var(--accent); }
.legal-card p{ font-size:13px; line-height:1.55; color:var(--text-dim); margin:0 0 12px; }
.app-content::-webkit-scrollbar{ display:none }
.tab-panel{ animation:fadeSlide .22s ease both; }
@keyframes fadeSlide{ from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
@media (prefers-reduced-motion:reduce){
  .tab-panel{ animation:none }
  .item-check,.theory,.era-head,.tab-btn,.vote-btn,.switch,.switch-knob,.era-progress-fill{ transition:none !important }
}

.section-label{ font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); margin:20px 0 10px; }
.section-label:first-child{ margin-top:8px }

/* era accordion */
.era{ border-bottom:1px solid var(--divider); }
.era-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 0; cursor:pointer; background:none; border:0; width:100%; text-align:left; font:inherit; color:inherit; }
.era-head:active{ transform:scale(.98) }
.era-head[data-static="1"]{ cursor:default }
.era-name{ font-family:var(--font-heading); font-weight:400; font-size:18px; margin:0 0 2px; text-wrap:balance; }
.era-years{ font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-size:11px; color:var(--text-dim); }
.era-blurb{ font-size:12.5px; line-height:1.5; opacity:.82; margin:0 0 10px; }
.era-meta{ display:flex; align-items:center; gap:10px; flex:none; }
.chip{ font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-size:10.5px; font-weight:700; letter-spacing:.02em; padding:3px 10px; border-radius:var(--chip-radius); background:var(--surface-2); color:var(--text-dim); white-space:nowrap; font-variant-numeric:tabular-nums; }
.chevron{ font-size:13px; color:var(--accent); flex:none; }

/* item row */
.item{ display:flex; gap:12px; padding:14px 0; border-top:1px solid var(--divider); }
.item-check{ flex:none; width:26px; height:26px; margin-top:1px; border-radius:50%; border:1.5px solid var(--accent); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; color:var(--accent-ink); background:transparent; transition:transform .15s ease, background .15s ease; }
.item-check.is-on{ background:var(--accent); }
.item-check:active{ transform:scale(.85) }
.item-body{ flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
.item-tags{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.fav-btn{ margin-left:auto; flex:none; background:none; border:0; padding:0; cursor:pointer; font-size:18px; line-height:1; color:var(--text-faint); transition:transform .15s ease, color .15s ease; }
.fav-btn.is-on{ color:var(--heat); }
.fav-btn:active{ transform:scale(.8); }
.tag-type{ font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-size:9.5px; font-weight:700; letter-spacing:.04em; padding:2.5px 8px; border-radius:var(--chip-radius); }
.tag-movie{ background:var(--tag-movie-bg); color:var(--tag-movie-fg); }
.tag-series{ background:var(--tag-series-bg); color:var(--tag-series-fg); }
.tag-special{ background:var(--tag-special-bg); color:var(--tag-special-fg); }
.tag-short{ background:transparent; color:var(--tag-short-fg); box-shadow:inset 0 0 0 1px var(--tag-short-fg); }
.item-title{ font-family:var(--font-heading); font-weight:400; font-size:16px; line-height:1.25; margin:0; }
.item-meta{ font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-size:12px; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.item-scores{ display:flex; gap:6px; align-items:center; margin-top:1px; }
.score-chip{ font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-size:9.5px; font-weight:700; letter-spacing:.02em; padding:2.5px 8px; border-radius:var(--chip-radius); background:var(--surface-2); color:var(--text-dim); font-variant-numeric:tabular-nums; }
.score-chip.is-hot{ background:var(--tag-movie-bg); color:var(--tag-movie-fg); }
.score-chip.is-cold{ background:transparent; box-shadow:inset 0 0 0 1px var(--tag-short-fg); color:var(--tag-short-fg); }
.score-chip.is-upcoming{ background:transparent; box-shadow:inset 0 0 0 1px var(--heat); color:var(--heat); font-variant-numeric:normal; }
.item-synopsis{ font-size:13.5px; line-height:1.45; opacity:.86; margin:2px 0 0; }
.rating{ display:flex; align-items:center; gap:7px; margin-top:5px; }
.rating-label{ font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); }
.stars{ display:flex; gap:5px; }
.star{ cursor:pointer; font-size:16px; line-height:1; background:none; border:0; padding:0; color:var(--divider); }
.star.is-on{ color:var(--accent); }
.empty-note{ font-style:italic; font-size:13.5px; color:var(--text-dim); padding:20px 0; }

/* roadmap layout */
.zoom-out-bar{ display:block; width:100%; margin:0 0 12px; padding:9px; border-radius:var(--card-radius); border:1px dashed var(--accent); background:var(--accent-soft); color:var(--accent); font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-size:12.5px; font-weight:700; cursor:pointer; position:sticky; top:0; z-index:2; }
.roadmap{ position:relative; padding:10px 0 10px 26px; transition:opacity .2s ease; }
.roadmap-line{ position:absolute; left:9px; top:8px; bottom:8px; width:2px; background:var(--divider); }
.roadmap-era{ position:relative; padding-bottom:4px; transition:opacity .25s ease; }
.roadmap-era.is-dimmed{ opacity:.32; }
.roadmap-era-head{ position:relative; display:block; width:100%; text-align:left; background:none; border:0; font:inherit; color:inherit; cursor:pointer; padding:10px 0 8px; }
.roadmap-era-head[data-static="1"]{ cursor:default; }
.roadmap-era-dot{ position:absolute; left:-26px; top:15px; width:12px; height:12px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px var(--bg); }
.roadmap-era-top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.roadmap-era-name{ font-family:var(--font-heading); font-weight:400; font-size:17px; margin:0; }
.roadmap-era-years{ font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-size:11px; color:var(--text-dim); white-space:nowrap; }
.roadmap-era-blurb{ font-size:12px; line-height:1.5; opacity:.8; margin:4px 0 0; }

.roadmap-item-dot{ position:absolute; left:-22px; top:13px; width:7px; height:7px; border-radius:50%; background:var(--surface-2); border:1.5px solid var(--divider); box-sizing:content-box; transition:transform .25s cubic-bezier(.2,.9,.3,1), background .15s ease, border-color .15s ease; }
.roadmap-item-dot.is-on{ background:var(--accent); border-color:var(--accent); }
.roadmap-item-dot.is-focused{ transform:scale(1.7); }
.roadmap-item-compact{ display:flex; align-items:center; gap:8px; padding:7px 0; cursor:pointer; background:none; border:0; width:100%; text-align:left; font:inherit; color:inherit; }
.roadmap-item-compact .roadmap-item-title{ font-family:var(--font-heading); font-weight:400; font-size:14.5px; margin:0; line-height:1.2; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.roadmap-item-compact-year{ font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-size:11px; color:var(--text-faint); flex:none; font-variant-numeric:tabular-nums; }
.roadmap-item-detail{ margin:0 0 10px; padding:12px 14px; border-radius:var(--card-radius); background:var(--surface); border:1px solid var(--divider); animation:roadmapZoomIn .22s cubic-bezier(.2,.9,.3,1) both; }
@keyframes roadmapZoomIn{ from{ opacity:0; transform:scale(.94) translateY(-4px); } to{ opacity:1; transform:scale(1) translateY(0); } }
.roadmap-era.is-zoomed{ opacity:1; }
.roadmap-era.is-zoomed .roadmap-era-dot{ transform:scale(1.5); box-shadow:0 0 0 4px var(--bg), 0 0 0 6px var(--accent-soft); }
.storyboard{ margin:0 0 18px; }
.storyboard-poster{ text-align:center; padding:6px 0 16px; }
.storyboard-line{ display:none; }
.storyboard-card{ position:relative; display:flex; gap:12px; padding:14px 0; border-top:1px solid var(--divider); }
.storyboard-num{ flex:none; width:26px; height:26px; border-radius:50%; background:var(--accent-soft); color:var(--accent); font-family:var(--font-heading); font-weight:400; font-size:13px; display:flex; align-items:center; justify-content:center; margin-top:2px; }
.storyboard-dot{ display:none; }
.storyboard-body{ flex:1; min-width:0; }
.storyboard-title{ font-family:var(--font-heading); font-weight:400; font-size:16px; margin:4px 0 4px; }
.storyboard-synopsis{ font-size:13px; line-height:1.5; color:var(--text-dim); margin:0; }
.roadmap-poster{ text-align:center; padding:6px 0 16px; }
.roadmap-poster-eyebrow{ font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin:0 0 2px; }
.roadmap-poster-title{ font-family:var(--font-heading); font-weight:400; font-size:30px; margin:0; }
.roadmap-item.has-marker{ margin-top:14px; }
.roadmap-marker{ display:inline-block; max-width:100%; box-sizing:border-box; margin:0 0 5px; font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; font-size:9.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:3px 9px; border-radius:20px; background:var(--accent); color:var(--bg); animation:roadmapMarkerIn .3s cubic-bezier(.2,.9,.3,1) both; opacity:1 !important; }
.roadmap-marker-here{ background:var(--heat); }

{id:'th-battleworld',title:"Secret Wars won't reboot the MCU — it'll reframe it through Battleworld",heat:3,source:'r/marvelstudios',body:"A widely discussed theory out of r/marvelstudios argues Marvel's next era isn't a hard reset at all: Secret Wars folds every timeline into a shared Battleworld, letting existing stories continue under a new cosmic status quo instead of erasing them. In the comics, God Emperor Doom literally stitched together fragments of dead universes into one patchwork planet, preserving pieces of continuities that had otherwise ended — which is exactly the mechanism fans think explains why Marvel keeps insisting nothing gets undone. Under this reading, the Raimi Spider-Man trilogy, the Fox X-Men saga and the mainline MCU wouldn't need to be reconciled into one clean timeline; they'd simply become adjacent zones stitched onto the same Battleworld, each retaining its own history and rules. That would also explain why Marvel has never established exactly how these separate film universes relate to each other geographically or chronologically — under Battleworld logic, they were never meant to line up in the first place. Some fans point to the visibly seamed, patchwork aesthetic teased in recent trailers as a literal visual cue that the borders between these worlds will be shown on screen, not hidden or smoothed over."},
{id:'th-doom-stark-variant',title:"Robert Downey Jr.'s Doctor Doom is a variant of Tony Stark",heat:4,source:'Fan theory roundup',body:"Since RDJ's casting was announced, fans have leaned into the idea that this Doom isn't Victor von Doom at all, but a Tony Stark from another timeline who never became Iron Man and hardened into a tyrant instead. The theory gained traction from small marketing details — a voice modulation that echoes Stark's own JARVIS-era cadence, and armor plating that riffs on classic Iron Man silhouettes rather than Doom's traditional medieval-inspired design. Recent Doomsday promo material teasing ties between the two roles has only fueled the theory further, with some fans pointing to a shot where Doom's mask cracks to reveal something ambiguous underneath rather than the expected Latverian scarring. If true, it would reframe the saga's central villain as a dark mirror of the hero who built the Avengers in the first place — someone who had every reason to become a savior and chose conquest instead. It would also let RDJ play essentially two opposed answers to the same question: what happens to a genius billionaire who never gets his cave-and-shrapnel wake-up call. Skeptics note Marvel has previously denied Doom is a Stark variant outright, but plenty of fans read that denial itself as exactly the kind of misdirection the studio has used before."},
{id:'th-dinosaur-doom',title:"A prehistoric Doom variant is hiding in the Savage Land",heat:2,source:'Fan theory roundup',body:"A glimpsed T. rex in Doomsday marketing sent fans hunting for Savage Land — Marvel's hidden Antarctic dinosaur preserve — and speculating that one of the film's many Doom variants is a feral, prehistoric version of the villain rather than another suited tyrant. The theory holds that with dozens of Doom variants confirmed to appear across the film, Marvel needed a way to keep them visually and tonally distinct beyond costume palette swaps, and a primal 'Dinosaur Doom' — comics-accurate to some of Doom's stranger multiversal appearances — would do exactly that. Some fans have gone further, suggesting this variant escaped containment during an earlier Incursion and has been surviving in Savage Land ever since, feral but still retaining fragments of Victor's genius-level intellect underneath the ferocity. Others think it's more of a visual gag than a plot-critical variant, existing mainly to signal just how far Marvel is willing to stretch the 'multiple Dooms' concept for spectacle rather than narrative weight. Either way, the fact that a dinosaur tease reads as plausible at all says something about how unhinged fans expect this multiversal roster to get before the credits roll."},
{id:'th-secret-wars-duology',title:"Secret Wars is quietly becoming two movies",heat:3,source:'Fan theory roundup',body:"With Doomsday's ensemble already ballooning past sixty heroes, rumors persist that Marvel will split Secret Wars into two parts rather than cram the entire crossover — X-Men, Fantastic Four and every multiversal variant included — into one runtime. Insiders have pointed to production logistics as much as story needs: reported shooting schedules and reshoot windows suggest a scope closer to a two-film commitment than a single blockbuster, and some leaked call sheets allegedly reference a 'Part One' and 'Part Two' internally. Story-wise, splitting the film would let Marvel spend real time on Battleworld's mechanics and the Doom conflict in the first installment before escalating to a true multiversal endgame in the second, rather than rushing both beats into one runtime the way Endgame's finale was criticized for compressing. Skeptics counter that Marvel walked back a similar two-part plan for Endgame itself late in production, and could do so again if the numbers don't support two theatrical releases this time either. Still, the sheer size of the confirmed cast alone has convinced a large chunk of the fanbase that one movie physically cannot do this ensemble justice."},
{id:'th-shuri-incursions',title:"Shuri is the first to detect the Incursions",heat:2,source:'Fan theory roundup',body:"Plot leaks suggest Wakandan tech, not a TVA readout, is what first catches the multiverse colliding with itself — with Shuri identifying the anomalies before the wider hero community even understands what an Incursion is. The idea plays on Wakanda's long-established status as the most technologically advanced nation in the MCU, giving Shuri's vibranium-based sensors a plausible edge over even the TVA's timeline-monitoring equipment, especially once the TVA is reportedly compromised or destroyed early in the film. Fans tracing this theory note that Wakanda Forever already set up Shuri as a scientist actively expanding vibranium's applications beyond her brother's work, making a leap into multiversal physics a believable next step for the character rather than a stretch. If accurate, it would hand Wakanda a pivotal, active role in the saga's central crisis rather than a purely reactive one, continuing the country's arc from isolated nation to central player in cosmic-level MCU events. Some also point to comic-book precedent, where Wakandan science has occasionally brushed up against multiversal and cosmic threats well before the rest of Earth catches on."},
{id:'th-loki-dead-doom',title:"Doctor Doom is responsible for Loki's death and the TVA's fall",heat:3,source:'Fan theory roundup',body:"Alleged plot details have Steve Rogers and Thor arriving at a destroyed Time Variance Authority to find Loki dead, with Doom named as the one who did it — positioning him as a threat that operates across time as easily as across universes. If true, this would be a stunning reversal for a character who spent an entire final season becoming the god who holds the timeline together, and fans are split on what it means: some read it as a genuine, permanent death that raises the stakes by removing the one being who seemed untouchable by Doom's incursions; others suspect a fake-out, arguing that a god who exists at the center of every timeline simultaneously might not stay dead the way an ordinary character would. The detail that the TVA itself falls alongside Loki is seen as especially significant, since it strips away the MCU's built-in safety net for time-related problems right when the story needs the stakes to feel unrecoverable. Some fans have also connected this to Doom's comic-accurate reputation as one of the few Marvel villains capable of matching or besting Doctor Strange in magical combat, which would make a god of the timeline a fitting, symbolic first casualty. Whether it sticks or not, this leak has become one of the most discussed and debated Doomsday details circulating right now."},
{id:'th-doom-mask-strange',title:"Doctor Strange spends most of Doomsday in a Doom-styled mask",heat:1,source:'Fan theory roundup',body:"Leaked promo stills reportedly show Stephen Strange in armor closer to Latveria than Kamar-Taj, fueling speculation that Strange is undercover, corrupted, or bound to Doom by a spell gone wrong for a large stretch of the film. Fans point to Strange's comic history of striking dangerous bargains — including with actual demons — as precedent for a scenario where he willingly dons Doom's colors as part of an infiltration plan, gathering intelligence from inside enemy lines rather than being outright possessed. Others lean toward a darker read: that a spell involving the Darkhold, or a desperate multiversal bargain to save a dying timeline, leaves Strange bound to serve Doom against his will, echoing his own willingness in Multiverse of Madness to use forbidden magic once the stakes got high enough. A smaller contingent thinks the mask is simply a disguise Strange dons briefly to move through hostile territory, with no deeper magical cost attached, and that fans are reading too much into a single costume choice from marketing stills. Whatever the explanation, the imagery has become a magnet for speculation given how rarely Marvel telegraphs a hero visually aligned with its central villain before a film even releases."},

{id:'th-mephisto',title:"Mephisto is pulling strings behind the multiverse",heat:3,body:"Fans have long theorized the demonic Mephisto — teased in WandaVision's finale as a wisp of red smoke that never got a follow-up, and referenced again in Agatha All Along — is secretly the architect of the multiverse's ongoing collapse. The theory holds that Mephisto has been manipulating Wanda's grief, Doctor Strange's ego and the TVA's bureaucracy from the shadows, using each of them as unwitting agents to widen the cracks between realities rather than confronting anyone directly. In the comics, Mephisto rarely acts alone; his signature move is offering someone exactly what they want most at exactly the moment their judgment is worst, which lines up neatly with Wanda's grief-fueled reality warping and Strange's repeated willingness to bend the rules of magic for a good enough reason. Fans point out that Marvel has teased and then quietly walked back Mephisto references multiple times, which they read less as the studio changing its mind and more as a deliberate long game keeping the character just visible enough to stay plausible. If true, he'd be positioned as a hidden hand behind the entire Multiverse Saga rather than a one-off tease that went nowhere — the demon nobody had to invite in because he was already influencing the people who mattered most."},
{id:'th-doom-loki',title:"Loki quietly becomes Doctor Doom's biggest obstacle",heat:2,body:"With Kang recast as Victor von Doom heading into Avengers: Doomsday, fans think Loki's mastery of time, illusion and mischief makes him uniquely suited to out-scheme a foe who thinks several moves ahead. The idea is that Doom's greatest weakness is assuming everyone else plays by the rules of cause and effect — and Loki, having already lived and rewritten his own timeline once during his own show, is the one variant who fundamentally doesn't. Some point to Loki's established ability to perceive and hold multiple timeline branches at once as a direct counter to Doom's own multiversal awareness, meaning any trap Doom sets assuming linear thinking could simply fail to register as a trap at all. Others go further and suggest Loki's godlike status at the end of his own show — literally sitting at the center of the timeline, holding every branch together — is exactly the leverage he'll need to intervene without needing to physically fight Doom head-on. If the theory holds, it would be a fitting capstone for a character whose entire arc has been about learning to use trickery for protection instead of personal gain."},
{id:'th-secret-wars',title:"Secret Wars merges the Fox and Sony universes permanently",heat:4,body:"The prevailing theory is that Avengers: Secret Wars won't just cross over the X-Men and Spider-Verse characters for one movie event — it will fuse their entire timelines into the mainline MCU going forward, not just for a cameo-heavy team-up. That would mean actors like Patrick Stewart, Hugh Jackman and Tobey Maguire's continuities cease to be separate universes and simply become MCU history from that point on, mirroring how the comics' original Secret Wars and Battleworld arcs permanently merged incompatible realities into one Marvel universe rather than reverting everything back afterward. Fans point to the sheer expense and rights complexity Marvel went through to secure these actors as evidence the studio wants a lasting integration, not a one-off nostalgia play that gets undone by the next film's opening scene. If this happens, decades of previously 'non-canon' films — the Raimi trilogy, the Fox X-Men saga, even Blade and the early 2000s Marvel adaptations — would retroactively become valid entry points into MCU history, turning Secret Wars into less of a crossover event and more of a continuity-legitimizing one. The scale of that would be unprecedented for a shared universe project, which is exactly why the theory has stayed so persistent despite Marvel never confirming it outright."},
{id:'th-valkyrie-king',title:"Valkyrie becomes the new ruler of a reformed Asgard",heat:1,body:"With Thor stepping back from active duty and New Asgard's population scattered and rebuilding, fans point to small hints — Valkyrie's coronation-adjacent staging in recent appearances, and her repeated framing as the one actually holding the community together while Thor is off-world — as evidence Marvel is positioning her to formally unite Asgard's survivors as its next monarch. The theory gains weight from how consistently the films have shown Valkyrie handling the practical, unglamorous work of leadership — logistics, defense, diplomacy — while Thor gets the mythic hero moments, suggesting the writers already see her as the more grounded ruler even if the title hasn't caught up yet. It would also close the loop on her arc from disgraced warrior exiled after Hela's rise, through reluctant King of New Asgard in Endgame's background, to an earned and formally recognized leader rather than someone who inherited the job by default. Some fans additionally read her search for a queen, teased in Love and Thunder, as connected groundwork for exactly this kind of formalized rule, giving Asgard a monarch whose personal life isn't treated as a side note to the political arc."},
{id:'th-young-avengers',title:"A Young Avengers team is being assembled in plain sight",heat:3,body:"Kate Bishop, Cassie Lang, Kid Loki, Billy and Tommy Maximoff, and Riri Williams have all been introduced in separate projects with almost no overlap so far — which is exactly the pattern fans point to as evidence Marvel is quietly building toward a formal Young Avengers roster rather than leaving these characters as standalone supporting players. The comics' Young Avengers lineup drew from nearly this exact bench of legacy heroes, and fans tracking the pattern note that each MCU introduction has deliberately given its character an unresolved thread — Kate's Ronin ambitions, Cassie's frustration at being sidelined, Billy and Tommy's search for their missing brother Wiccan and Speed counterparts — that a team-up project could resolve all at once. Between America Chavez's multiversal travel abilities and Eli Bradley already existing in the background of the comics this show draws from, some believe the team could be revealed as a fully-formed ensemble in a single surprise announcement rather than the slow, project-by-project buildup Marvel used for the original Avengers. Whether that reveal comes as its own film or as a spinoff series, fans see the current scattering of characters as too specific and too comics-accurate to be a coincidence."},
{id:'th-vision-variants',title:"White Vision variants are multiplying across the timeline",heat:2,body:"Since WandaVision left White Vision with his memories restored but his loyalties deliberately unresolved, fans believe multiple Vision variants — synthetic, human-hybrid, and fully robotic — could be running around different corners of the multiverse simultaneously rather than there being one single 'true' Vision anywhere. Because Vision's entire comic history revolves around him being rebuilt, copied, reprogrammed, and even split into separate personas at different points, the show's ending reads to fans less like a final answer and more like an opening premise for exactly this kind of proliferation. Some point to the specific ambiguity of White Vision's final scene — walking away with his memories but no clear allegiance — as evidence the writers wanted an unresolved variant loose in the multiverse on purpose, rather than an oversight to be patched up later. Taken further, some think the eventual payoff is a story where several Visions, each shaped by a different version of his relationship with Wanda or the Avengers, have to reconcile with each other rather than one character simply resolving a single personal arc."},
{id:'th-daredevil-crossover',title:"Kingpin is being built into the Multiverse Saga's central villain",heat:2,body:"Wilson Fisk's rise in Daredevil: Born Again, paired with his successful run for mayor of New York, has fans speculating he's being set up as a street-level throughline that eventually connects to Spider-Man's next chapter and even wider Manhattan-based stories, rather than staying contained to his own series. The theory is that Fisk's legitimate political power, not just his criminal empire, is what makes him dangerous enough to anchor a saga-spanning arc — a mayor with subpoena power, oversight of the NYPD, and public legitimacy is a categorically different threat than a crime boss operating purely in the shadows. Fans also note that Fisk's comics history includes exactly this kind of dual-track influence, using elected office as camouflage for organized crime rather than choosing one path over the other. If Marvel is building him into a Multiverse Saga-level antagonist, some expect his political reach to eventually intersect with federal super-powered oversight questions the films have raised since Sokovia, giving him leverage far beyond what any single street-level hero could counter alone."},
{id:'th-fantastic-four-future',title:"The Fantastic Four are actually multiversal transplants",heat:3,body:"Because First Steps is deliberately set in a retro-futurist alternate timeline rather than the mainline MCU's present day, many fans believe Reed Richards's family will physically travel into the mainline universe via a multiversal incursion, rather than the mainline timeline simply adjusting to accommodate them after the fact. That would explain why their world looks so visually distinct, down to the technology, fashion and skyline design — it was never meant to blend in, because the story's whole point is that they don't belong there yet and the visual mismatch is a clue, not an art-direction quirk. Fans tracing the theory point to the comics' own long history of the Fantastic Four traveling between realities as a core part of their identity, making a transplant storyline feel less like a gimmick and more like a faithful adaptation of who these characters fundamentally are. Some go further and suggest the family's displacement is what triggers or accelerates the wider Incursion crisis rather than being a side effect of it, making Reed's own scientific curiosity about crossing dimensional boundaries indirectly responsible for the saga's central threat."},
{id:'th-iron-man-loop',title:"Tony Stark's arc reactor tech seeded Kang's tech centuries early",heat:1,body:"Some fans think the miniaturized arc reactor Tony built from spare parts in a cave was suspiciously advanced for its era, and speculate it was quietly reverse-engineered from stray Kang technology left behind after an earlier, failed incursion into that timeline. The theory would recontextualize Stark Industries' unusually rapid advancement across the Infinity Saga — from a car-battery-powered chest device to city-saving arc reactor infrastructure within a few years — as evidence of contamination from the future rather than pure genius on Tony's part alone. Fans point to the oddly clean, almost anachronistically elegant design language of some of Tony's later tech as a visual tell, arguing it reads more like reverse-engineered future hardware than something built from scratch by a single inventor working alone in a workshop. If accurate, it would tie Tony's entire legacy into the timeline war he never knew was happening, turning his greatest achievements into unwitting echoes of a threat the Avengers wouldn't properly confront until long after his death."},
{id:'th-avengers-fury-plan',title:"Nick Fury planned to lose the Battle of New York on purpose",heat:1,body:"A theory holds that Fury deliberately let the Chitauri invasion escalate further than SHIELD could easily contain, specifically to force the World Security Council into funding and approving the Avengers Initiative that peacetime bureaucracy would never have signed off on otherwise. Fans point to how conveniently the timing lines up: Fury had been quietly assembling the Avengers Initiative's file for years before the invasion, and the Council's own nuclear option against Manhattan only strengthened his case that unsanctioned oversight of super-powered individuals was untenable going forward. It reframes Fury less as a man caught off guard by an alien invasion and more as someone playing a longer, colder political game with New York — and the lives in it — as the stakes, willing to let a crisis run further than strictly necessary if it secured the institutional backing he needed. Skeptics note this reads Fury as needlessly cruel for a character the films otherwise present as pragmatic rather than ruthless, but supporters counter that 'pragmatic' has always been Fury's actual defining trait, not a soft substitute for it."},
{id:'th-civil-war-zemo',title:"Zemo's plan in Civil War was engineered with future help he never named",heat:2,body:"Because Zemo's intelligence-gathering — tracking down Bucky's brainwashing triggers, HYDRA files and the Avengers' exact schedules — was implausibly fast and precise for one grieving colonel acting alone with no institutional support, some fans think he had a silent backer, possibly a HYDRA remnant or even an early Kang variant, that the films never followed up on or explained. The theory points to specific logistical leaps Zemo makes with almost no on-screen explanation — locating a heavily classified HYDRA base, obtaining Winter Soldier trigger words that should have been need-to-know at the highest level — as evidence someone with far greater resources was feeding him information. It would explain how a single non-powered man managed to dismantle the Avengers from the inside without ever needing a suit or a superpower of his own, reframing his plan as the visible tip of a much larger, unseen operation rather than the work of a lone genius with a grudge."},
{id:'th-infinity-endgame-stones',title:"The Infinity Stones seen after Endgame are already reforming",heat:2,body:"Since the Stones were returned to their exact points in time rather than destroyed outright, some fans believe they are quietly reconverging somewhere the movies haven't shown yet, drawn back together by the same cosmic pull that originally formed them across the universe's early history. The theory rests on the idea that the Stones aren't just powerful objects but fundamental expressions of reality itself, meaning scattering them across time delays their reunion rather than preventing it outright, the same way physically separating six magnets doesn't stop them wanting to snap back together. If that's true, they could resurface as a plot device at any point without contradicting Endgame's ending, since technically nothing about their power was ever erased — just scattered further apart in time than usual, buying the universe decades rather than eliminating the threat for good. Some fans specifically watch for six unexplained anomalies scattered across recent projects as evidence the reformation has already quietly begun."},
{id:'th-guardians3-rocket',title:"Rocket's creator, the High Evolutionary, has more surviving experiments loose in the galaxy",heat:1,body:"Vol. 3 only showed a handful of the High Evolutionary's failed test subjects from Rocket's home lab, but fans think that given how many species and worlds he experimented on throughout his long, unseen history, far more of his early creations must still be out there, unaccounted for and potentially dangerous. The film itself hinted at this scale, briefly showing rooms upon rooms of test subjects beyond the small group Rocket escapes with, suggesting the sequence audiences saw was a fraction of a much larger operation spanning who knows how many planets. Some speculate future Guardians-adjacent stories could introduce entire hidden colonies of his abandoned experiments, each with their own society shaped by whatever partial modifications the High Evolutionary left them with, as a way of expanding that corner of the cosmic MCU beyond just Rocket's personal backstory. Others think it's simply world-building color meant to make the High Evolutionary feel appropriately monstrous in scale, without Marvel necessarily planning to revisit it directly."},
{id:'th-loki-s2-throne',title:"Loki sitting at the heart of the timeline sets up a future god-like role",heat:2,body:"Loki's finale image — alone at the center of the Yggdrasil-like structure, physically holding every timeline together to prevent them from collapsing — has fans theorizing he'll return in a cosmic, almost divine capacity rather than as a street-level hero fighting alongside the Avengers again in a conventional team-up. Some compare it directly to the comics' 'God Loki' era, where Loki effectively becomes a steward of reality itself instead of a trickster reacting to other people's plans, gaining authority and perspective that puts him above the usual hero-villain skirmishes entirely. Fans point out that this ending leaves Loki functionally omnipresent across every branching timeline at once, which raises the question of how — or whether — he could ever appear in a conventional team-up film without breaking the internal logic of what the finale established him to be. Some think this tension is exactly why Marvel hasn't rushed to bring him back in a traditional role, and that any reappearance will have to grapple directly with what it means for a god of the timeline to step back down into a single story."},
{id:'th-madness-illuminati',title:"The Illuminati's death in Multiverse of Madness was a setup for their real-universe counterparts",heat:2,body:"Because that entire Illuminati lineup was wiped out on a side-universe variant of Earth, some fans expect the mainline versions of Reed Richards, Professor X and Captain Marvel to eventually form their own version of the group under different, hopefully less doomed circumstances than their variant counterparts faced. The theory suggests Marvel killed off that particular team specifically so the concept could be reintroduced later without fans assuming it's the exact same doomed lineup walking into an obviously fatal situation a second time, effectively clearing the idea for a fresh, higher-stakes attempt. Fans point out that the comics' Illuminati was always meant to represent Earth's brightest minds making quiet, morally compromised decisions behind the scenes — exactly the kind of ethically murky group dynamic the MCU has been building toward as its hero roster grows large enough to need behind-the-curtain coordination. If the mainline Illuminati does form, some expect its first real test to be a decision none of its individual members could justify making alone."},
{id:'th-ms-marvel-mutant',title:"Kamala Khan's powers are the spark of the MCU's mutant reveal",heat:3,body:"Kamala's comic-accurate mutant gene was noticeably downplayed on screen in favor of a bracelet-based origin, but many fans think this was a deliberate delay tactic and that her powers will eventually be revealed as the trigger that formally introduces mutants to the mainline MCU rather than a permanent retcon of her comic origin. The theory holds that Marvel wanted her Disney+ debut to focus on identity, family and community first, without the added complexity of introducing the X-gene and everything that historically comes with it — persecution, registration debates, an entire parallel society — in a single season. Fans point to small lingering hints that her powers still don't fully make sense under the bracelet explanation alone as evidence the writers left themselves room to walk it back or expand on it later, saving the X-gene reveal for a moment with bigger stakes across the wider saga rather than burying it in a first season. If Marvel does go this route, Kamala would effectively become the quiet hinge between two eras of the franchise: the one before mutants existed on screen, and the one after."},
{id:'th-wakanda-forever-successor',title:"A new Black Panther will be revealed to have been chosen earlier than shown",heat:1,body:"Some fans believe the Wakandan elders and Shuri quietly identified her eventual successor during the time skip in Wakanda Forever, well before any on-screen reveal, and that the mantle's next bearer has already been present in the background of later projects without being formally introduced as Black Panther yet. It would mirror the comics' tendency to seed a successor visually long before making the transition official — background appearances, unexplained training sequences, small callbacks that only make sense in retrospect once the reveal actually lands. Fans specifically point to the ceremonial staging around Shuri's own ascension as evidence Wakanda's succession process is more deliberate and forward-planning than the films have shown directly, suggesting the nation's leadership doesn't wait for a crisis to decide who's next. If true, the eventual reveal would recontextualize scenes fans already watched, the same way Shuri's own emergence gained new weight once her arc was complete."},
{id:'th-deadpool-wolverine-cameo',title:"The cameos in Deadpool & Wolverine hint at a full multiversal reunion film",heat:2,body:"The sheer number and specificity of variant cameos packed into one movie has fans convinced Marvel is using it as a proof of concept for a much larger crossover event that formally reunites actors from the Fox X-Men era within the mainline timeline, rather than a one-off joke reserved for a single irreverent film. The film's structure — deliberately pulling from decades of near-miss and canceled Fox projects, giving actors a chance to play characters they were once attached to but never got to portray on screen — reads to fans less like nostalgia for its own sake and more like Marvel testing which specific reunions land hardest with audiences. Some think the cameos were a deliberate temperature check on fan appetite before committing to that reunion at a bigger scale in Secret Wars, essentially using Deadpool & Wolverine's meta-humor as cover to gauge reaction without the pressure of a mainline Avengers-tier film. If that's the case, the specific characters who got the loudest reactions may end up getting expanded roles down the line."},
{id:'th-ironheart-ai',title:"Riri Williams' A.I. companion parallels Tony Stark's early tech more than it looks",heat:1,body:"Fans have pointed out visual and behavioral design parallels between Ironheart's A.I. companion and Tony Stark's earliest JARVIS prototypes, suggesting a deeper technological lineage between the two inventors than the show states outright or explains on screen. Some speculate Riri's tech may be built on salvaged or licensed Stark Industries architecture — perhaps recovered MIT research, or components that filtered down through university programs Tony's foundation quietly funded — rather than being entirely her own invention from scratch, despite the show framing her as a self-made genius. The theory doesn't necessarily diminish Riri's brilliance so much as suggest her work stands on Stark-adjacent shoulders the same way most real engineering builds on prior research, setting up a future plot thread about intellectual property, legacy and who really owns Tony's innovations now that he's gone. If Marvel pursues this, it could position Riri as both an independent inventor and an unwitting inheritor of Stark's unfinished business."},
{id:'th-thunderbolts-name',title:"The Thunderbolts will be publicly rebranded to hide their pasts",heat:1,body:"Given the team's checkered histories as assassins, super-soldiers and disgraced agents, some fans expect their in-universe public identity to shift again once government oversight and public relations get involved, echoing the comics' repeated Thunderbolts rebrands under different team names and cover stories across multiple eras. The comics version of this team has cycled through several public identities specifically because 'Thunderbolts' carries too much baggage once the public learns what the name actually stands for, and fans expect the MCU to follow the same pattern once the team needs to operate with any degree of public trust or government sanction. The idea is that the team's actual composition might stay the same while the public-facing brand changes entirely, similar to how the group's comic-book history has cycled through several identities without ever fully escaping their origins as morally compromised operatives being managed rather than truly redeemed."},
{id:'th-daredevil-fisk-reelection',title:"Fisk's mayoral run in Born Again is a longer game than City Hall",heat:2,body:"Some fans think Wilson Fisk's political ambitions are a stepping stone toward influencing Damage Control or federal-level super-powered oversight rather than simply controlling New York City government for its own sake, treating the mayor's office as a launching pad rather than an endpoint. The theory frames his mayoral campaign as the opening move in a much larger plan to legitimize his control over how superhumans are policed nationally, using elected office as cover for something far more sweeping than local crime control — access to federal resources, oversight committees, and the kind of institutional legitimacy no crime boss could otherwise obtain. Fans point to Fisk's comics history of similarly using legitimate business and political fronts to expand his criminal reach well beyond what a purely underworld operation could manage, arguing the show is following that same long-game playbook rather than inventing a new one. If accurate, City Hall would only be the first visible domino in a much longer chain."},
{id:'th-she-hulk-awareness',title:"She-Hulk's fourth-wall awareness means she can perceive other MCU realities",heat:2,body:"Because Jennifer Walters can talk directly to the audience and even manipulate the show's own credits, some fans theorize her awareness technically makes her conscious of other timelines and realities too, not just the fact that she's a character in a show being watched by an audience. Taken further, some think this meta-awareness could eventually let her interact with the multiverse in ways other heroes physically can't, since she's already proven — repeatedly, and played for comedy rather than danger — that she can break rules the format itself is supposed to enforce, which is functionally not that different from breaking the rules that separate one universe from another. Fans point out that most multiversal travel in the MCU requires specific technology or magic, while Jen seemingly needs only narrative awareness, making her a uniquely low-effort wildcard if Marvel ever wanted a joke-forward way to reference other realities without building elaborate lore to justify it. Whether the studio ever cashes this in remains an open question, since it would require treating a comedic device as a genuine plot mechanic."},
{id:'th-agatha-coven',title:"Agatha's coven survivors will resurface as recurring antagonists",heat:1,body:"With most of the Witches' Road coven eliminated during the season but at least one or two witches left unaccounted for, fans expect at least one of them to return with a grudge against Agatha or against Wanda's lingering magical legacy, rather than the surviving characters simply fading out of the story. Given how personal and grudge-driven witch politics have been shown to be in this corner of the MCU — alliances that shift within a single episode, betrayals that outlast the characters who committed them — some think a survivor returning for revenge is less a possibility than an inevitability baked into the show's own internal logic. Fans specifically point to how the show left certain coven members' fates deliberately vague rather than definitively resolved, a choice that reads as intentional narrative breathing room rather than an oversight, especially given how tightly the rest of the season's plot threads were tied off."},
{id:'th-x-men-97-crossover',title:"X-Men '97's animated continuity will eventually intersect live action",heat:2,body:"Given how openly Marvel has embraced the multiverse concept across every other project, a vocal fan contingent believes X-Men '97's Age of Apocalypse cliffhanger is being deliberately set up as a bridge into live-action mutant stories rather than staying a self-contained animated sequel with no further consequences. Some point to visual and tonal choices in the show that seem engineered to work as a jumping-on point for viewers who've never touched the original '90s cartoon, arguing that level of newcomer-friendly care wouldn't be necessary if Marvel intended the show to stay a nostalgia-only side project forever. Fans also note that Marvel has increasingly treated its animated slate as canon-adjacent rather than clearly separate, with What If...? already establishing that alternate-timeline events can matter to the mainline story, making a live-action crossover feel structurally plausible rather than like wishful fan thinking."},
{id:'th-werewolf-hunters',title:"The Werewolf by Night hunters lodge has more monsters cataloged than shown",heat:1,body:"Elsa Bloodstone's family archive, briefly glimpsed on screen during the special, has fans convinced that far more monster-hunting lore — and monsters — exist in that world than the 53-minute runtime had room to show, given how densely the background art was packed with references during that single sequence. Given how densely packed with references the special already was, cramming in comics-accurate creatures and hunter lore into corners of the frame most viewers would need to pause to catch, some think an entire hidden bestiary is waiting to be unpacked if Marvel ever returns to that corner of the universe with a proper series or feature. The special's black-and-white, practical-effects-driven horror aesthetic was also such a distinct tonal swing from the rest of the MCU that fans see it as a signal Marvel is willing to let this specific corner of its universe stay stylistically separate, giving any future expansion room to keep its own identity rather than being smoothed into the main house style."},
{id:'th-black-widow-red-room',title:"More Red Room graduates are still undercover in plain sight",heat:1,body:"Black Widow only showed a handful of the Red Room's trained Widows escaping their captivity, but some fans think many more are still embedded undetected in other organizations across the MCU, having been placed there long before Natasha's story even began and never given a reason to reveal themselves. The theory suggests some characters already introduced in unrelated projects — background agents, unnamed operatives, even seemingly minor antagonists — could later be revealed as former Widows whose true origin has simply never come up on screen yet, since the Red Room's entire training doctrine was built around long-term embedded deception rather than short missions. Fans point out that Natasha's own arc took years of screen time before her Red Room past was fully explored, meaning other graduates could plausibly exist in plain sight for just as long without audiences having any reason to suspect them."},
{id:'th-shangchi-rings',title:"The Ten Rings are alien tech that will resurface at a cosmic scale",heat:2,body:"Since the Rings were revealed to be extraterrestrial technology rather than purely mystical artifacts, fans speculate they function as a signaling device that will eventually summon their original owners back to Earth, turning what looked like a grounded martial-arts origin story into the opening chapter of a much bigger cosmic threat than anyone in the film realized at the time. Some think the rings' dormant activity in the film's final scenes was a deliberate hint that they're still transmitting somewhere no character has thought to check, quietly broadcasting a signal that's been active the entire time Shang-Chi's family used them as symbols of terrestrial power rather than what they actually are. Fans point out that treating deeply personal, family-scale stories as the opening notes of much larger cosmic threats is a pattern Marvel has used before, and the Ten Rings' alien origin fits that pattern almost too cleanly to be a coincidence."},
{id:'th-eternals-celestials',title:"A Celestial is already forming beneath another planet in the MCU",heat:1,body:"Because Tiamut was shown midway through emerging from underneath Earth before being stopped, some fans believe at least one more Celestial is incubating beneath a different planet already established in the MCU, and will surface later in the Multiverse Saga as a much larger-scale threat than a single planet can contain on its own. The theory treats Eternals less as a contained one-off story and more as the first sign of a planet-sized problem still waiting to happen elsewhere, since the film explicitly established that Celestial incubation is a routine, ongoing cosmic process rather than something unique to Earth. Fans point to specific planets glimpsed briefly across other cosmic-set projects as candidates worth watching, arguing that if Marvel planted a second incubating Celestial anywhere, it likely happened quietly, in the background of a scene that wasn't drawing attention to it at the time."},
{id:'th-whatif-watcher',title:"The Watcher is quietly influencing outcomes despite his oath of neutrality",heat:2,body:"Uatu the Watcher broke his sworn oath of non-interference at least once on screen to save a timeline he cared about, and a common fan theory holds that he has quietly nudged events several more times without the show ever revealing it directly to the audience, since his entire narrative function depends on the audience trusting a narrator who has already proven willing to lie about his own restraint. Because his entire narrative function is to observe without acting, fans find it more dramatically interesting to assume he's an unreliable narrator about his own restraint rather than a genuinely passive observer, since a truly hands-off Watcher would make for a much less compelling anthology host than one secretly steering outcomes from behind the curtain. Some point to suspiciously convenient near-misses across multiple What If...? timelines as evidence of exactly this kind of quiet intervention, moments that could be read as coincidence individually but start to look deliberate in aggregate."},
{id:'th-hawkeye-successor',title:"Kate Bishop will formally inherit the Ronin identity, not just the bow",heat:1,body:"With Clint Barton stepping back from field work to focus on his family, fans expect Kate Bishop to eventually take on the Ronin mantle herself in a more official capacity, rather than simply inheriting his old equipment and archery skills without the darker identity attached to them. The theory points to her comfort with morally gray tactics throughout the show — willingness to use intimidation, operate outside strict legal lines, and make calls Clint himself hesitates over — as evidence she's being built toward the darker, more solitary Ronin identity rather than a straightforward, sunnier Hawkeye successor role. Fans also note that the show deliberately let her handle the Ronin suit and confront its legacy directly rather than keeping it locked away as a closed chapter of Clint's past, a choice that reads as setup rather than simple closure."},
{id:'th-moonknight-avatars',title:"Moon Knight's Egyptian gods are recruiting more human avatars off-screen",heat:1,body:"Since both Khonshu and Ammit were shown actively searching for and binding themselves to human hosts, some fans think other Egyptian gods introduced or referenced in that corner of the MCU are doing the same thing simultaneously, off-screen, and simply haven't been given their own story yet to reveal it. The theory suggests an entire hidden network of god-and-avatar pairs could already exist across different cities or even different countries, each operating under the same rules Khonshu and Ammit demonstrated but never crossing paths with Marc, Steven or Layla directly. Fans point to how casually the show treated the idea of multiple gods each having their own avatar system as an established, unremarkable fact of that world, arguing the show wouldn't have bothered establishing that scale of infrastructure if it only mattered for one character's origin story."},
{id:'th-quantumania-kang-council',title:"Kang variants are already aware of each other across the Multiverse Saga",heat:2,body:"Because the Council of Kangs was shown as a group of cooperating variants working together toward shared goals despite their notoriously competitive, ego-driven nature, some fans believe the individual Kangs seen separately in Loki and Quantumania are covertly coordinating behind the scenes rather than each acting alone and unaware of the others, which would make their apparent independence a deliberate misdirection rather than the full picture. If true, that would mean every Kang encounter across the saga has actually been part of one larger, deliberately synchronized plan all along, with each variant playing a specific role — distraction, resource-gathering, information denial — rather than genuinely competing against each other the way their onscreen conflicts suggest. Fans point to the sheer implausibility of so many genius-level, time-traveling variants of the same person failing to notice each other's activities as evidence that at least some awareness, if not outright cooperation, must already exist between them."},
];
function fanScoreFor(id, critic){
  let h = 0; for (let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) >>> 0;
  const jitter = ((h % 9) - 4) / 10;
  return Math.max(1, Math.min(5, Math.round((critic/20 + jitter)*10)/10));
}

      var fan = fanScoreFor(it.id, critic).toFixed(1);
      var criticCls = critic>=75 ? 'is-hot' : (critic>=45 ? '' : 'is-cold');
      scoresBlock = '<div class="item-scores"><span class="score-chip '+criticCls+'">CRITICS '+critic+'%</span><span class="score-chip">FANS '+fan+'/5</span></div>';
    }
    detail =
      '<div class="roadmap-item-detail">'+
        '<div class="roadmap-item-meta">'+meta+'</div>'+
        scoresBlock+
        '<p class="roadmap-item-synopsis">'+esc(it.synopsis)+'</p>'+
        stars+
        '<button type="button" class="zoom-out-link" data-act="focusRoadmapItem" data-id="'+esc(it.id)+'">▲ Close details</button>'+
      '</div>';
  }

  return (
    '<div class="roadmap-item'+(focused?' is-focused':'')+(dimmed?' is-dimmed':'')+(marker?' has-marker':'')+'" id="rm-'+esc(it.id)+'">'+
      '<div class="roadmap-item-dot '+(watched?'is-on':'')+(focused?' is-focused':'')+'"></div>'+
      markerTag+
      compact+detail+
    '</div>'
  );
}
function renderRoadmapEra(era, s){
  var dimmed = s.roadmapFocus && !era.items.some(function(it){ return it.id === s.roadmapFocus; });
  var head = era.collapsible
    ? '<button type="button" class="roadmap-era-head" data-act="toggleEra" data-id="'+esc(era.id)+'">'+
        '<div class="roadmap-era-dot"></div>'+
        '<div class="roadmap-era-top"><h3 class="roadmap-era-name">'+esc(era.name)+' <span class="chevron">'+era.chevron+'</span></h3><span class="roadmap-era-years">'+esc(era.years)+' · '+era.progressLabel+'</span></div>'+
        (era.blurb&&!s.roadmapFocus?'<p class="roadmap-era-blurb">'+esc(era.blurb)+'</p>':'')+
      '</button>'
    : '<div class="roadmap-era-head" data-static="1">'+
        '<div class="roadmap-era-dot"></div>'+
        '<div class="roadmap-era-top"><h3 class="roadmap-era-name">'+esc(era.name)+'</h3><span class="roadmap-era-years">'+esc(era.years)+' · '+era.progressLabel+'</span></div>'+
        (era.blurb&&!s.roadmapFocus?'<p class="roadmap-era-blurb">'+esc(era.blurb)+'</p>':'')+
      '</div>';
  var sectionDimmed = s.expandedEra && era.collapsible && s.expandedEra !== era.id;
  var sectionZoomed = s.expandedEra && era.collapsible && s.expandedEra === era.id;
  var items = era.expanded ? era.items.map(function(it){ return renderRoadmapItem(it, s, s.roadmapMarkers ? s.roadmapMarkers[it.id] : null); }).join('') : '';
  return '<div class="roadmap-era'+(dimmed||sectionDimmed?' is-dimmed':'')+(sectionZoomed?' is-zoomed':'')+'" id="rme-'+esc(era.id)+'">'+head+items+'</div>';
}
function renderTimeline(s){
  var eras = filteredEras(s);
  if(!eras.length){
    return '<div class="tab-panel"><p class="empty-note">No titles match &ldquo;'+esc(s.search)+'&rdquo;.</p></div>';
  }
  if(s.layout === 'roadmap'){
    var flatIds = [];
    eras.forEach(function(era){ era.items.forEach(function(it){ flatIds.push(it.id); }); });
    var markers = {};
    if(flatIds.length){
      if(s.viewMode === 'doomsday'){
        markers[flatIds[0]] = 'start';
        markers[flatIds[flatIds.length-1]] = 'finish';
      }
      var nextUnwatched = flatIds.find(function(id){ return !s.watched[id]; });
      if(nextUnwatched && !markers[nextUnwatched]) markers[nextUnwatched] = 'here';
    }
    s.roadmapMarkers = markers;
    var zoomBar = s.roadmapFocus ? '<button type="button" class="zoom-out-bar" data-act="focusRoadmapItem" data-id="'+esc(s.roadmapFocus)+'">⤢ Zoom out to full timeline</button>' :
      (s.expandedEra ? '<button type="button" class="zoom-out-bar" data-act="toggleEra" data-id="'+esc(s.expandedEra)+'">⤢ Zoom out to full timeline</button>' : '');
    return '<div class="tab-panel"><div class="roadmap-poster"><h6 class="roadmap-poster-eyebrow">Avengers, Assemble</h6><h2 class="roadmap-poster-title">You will get there</h2></div>'+zoomBar+'<div class="roadmap'+(s.roadmapFocus?' has-focus':'')+'"><div class="roadmap-line"></div>'+eras.map(function(era){ return renderRoadmapEra(era, s); }).join('')+'</div></div>';
  }
  return '<div class="tab-panel">'+eras.map(renderEra).join('')+'</div>';
}

function renderHomeHeader(){
  return '<h6 class="eyebrow">Your Progress</h6><h1 class="title">Rewatch</h1>';
}
function renderHome(s){
  var totalMin=0, watchedMin=0, totalCount=0, watchedCount=0;
  ALL_ITEMS_CONNECTED().forEach(function(it){
    totalMin += it.min; totalCount++;
    if(s.watched[it.id]){ watchedMin += it.min; watchedCount++; }
  });
  var pct = totalCount ? Math.round(watchedCount/totalCount*100) : 0;
  var perEra = RAW_ERAS.map(function(era){
    var w = era.items.filter(function(it){ return s.watched[it.id]; }).length;
    var t = era.items.length;
    return {name:era.name, w:w, t:t, pctWidth: t ? Math.round(w/t*100)+'%' : '0%'};
  });
  var recent = s.watchedOrder.slice(0,5).map(function(id){
    var it = ALL_ITEMS.find(function(x){ return x.id===id; });
    return it ? {title:it.title, year:it.year} : null;
  }).filter(Boolean);

  var eraBars = perEra.map(function(pe){
    return '<div class="era-progress"><div class="era-progress-row"><span>'+esc(pe.name)+'</span><span>'+pe.w+'/'+pe.t+'</span></div>'+
      '<div class="era-progress-track"><div class="era-progress-fill" style="width:'+pe.pctWidth+'"></div></div></div>';
  }).join('');

  var recentBlock = recent.length
    ? recent.map(function(r){ return '<div class="recent-row"><span>'+esc(r.title)+'</span><span class="recent-year">'+r.year+'</span></div>'; }).join('')
    : '<p class="empty-note">Nothing watched yet — check off a title in the Timeline tab.</p>';

  var favorites = s.favoriteOrder.map(function(id){
    var it = ALL_ITEMS.find(function(x){ return x.id===id; });
    return it ? {id:it.id, title:it.title, year:it.year, type:it.type} : null;
  }).filter(Boolean);
  var favoritesBlock = favorites.length
    ? '<button type="button" class="filters-toggle" style="margin-bottom:10px" data-act="toggleStoryboard">'+(s.showStoryboard?'Hide storyboard ▾':'View as storyboard ▸')+'</button>'+
      (s.showStoryboard ? renderStoryboard(s) : favorites.map(function(f){
        return '<div class="recent-row favorite-row"><span><span class="tag-type tag-'+TYPE_TAG[f.type].replace('tag-','')+'" style="margin-right:8px">'+TYPE_LABEL[f.type]+'</span>'+esc(f.title)+'</span><span class="recent-year">'+f.year+'</span></div>';
      }).join(''))
    : '<p class="empty-note">No favorites yet — tap the heart on any title in the Timeline tab.</p>';

  var upcoming = ALL_ITEMS.filter(function(it){ return it.upcoming; });
  var nextBlock = upcoming.length
    ? '<div class="next-release">'+upcoming.map(function(it){
        return '<div class="next-release-row"><div><div class="next-release-title">'+esc(it.title)+'</div>'+
          '<div class="next-release-type">'+TYPE_LABEL[it.type]+'</div></div>'+
          '<span class="next-release-date">'+esc(it.releaseDate||'TBA')+'</span></div>';
      }).join('')+'</div>'
    : '';
  var nextSection = upcoming.length ? ('<h6 class="section-label">Next release</h6>'+nextBlock) : '';

  return (
    '<div class="tab-panel">'+
      '<div class="stat-row"><div class="stat-pct">'+pct+'%</div><div class="stat-sub">watched<br>'+watchedCount+' of '+totalCount+' titles</div></div>'+
      '<p class="stat-caption">'+fmtMin(watchedMin)+' watched · '+fmtMin(totalMin-watchedMin)+' left</p>'+
      nextSection+
      '<h6 class="section-label">Your favorites</h6>'+favoritesBlock+
      '<h6 class="section-label">Progress by era</h6>'+eraBars+
      '<h6 class="section-label">Recently watched</h6>'+recentBlock+
    '</div>'
  );
}
function ALL_ITEMS_CONNECTED(){ return RAW_ERAS.reduce(function(a,e){ return a.concat(e.items); }, []); }

function renderTheoriesHeader(s){

    '</div>'
  );
}
function renderTheories(s){
  var q = s.theorySearch.trim().toLowerCase();
  var list = s.userTheories.concat(ALL_THEORIES);
  if(q){
    list = list.filter(function(t){
      return t.title.toLowerCase().indexOf(q)!==-1 || t.body.toLowerCase().indexOf(q)!==-1;
    });
  }
  if(s.theorySort === 'buzz'){
    list = list.slice().sort(function(a,b){ return b.heat - a.heat; });
  }
  var form = s.showNewTheory
    ? '<div class="theory-form" data-act="stop">'+
        '<input class="field-input" type="text" placeholder="Theory title" value="'+esc(s.newTheoryTitle)+'" data-bind="theoryTitle" data-focus-id="theory-title">'+
        '<textarea class="field-textarea" placeholder="Explain your theory…" data-bind="theoryBody" data-focus-id="theory-body">'+esc(s.newTheoryBody)+'</textarea>'+
        '<button type="button" class="btn btn-primary" data-act="submitTheory">Post theory</button>'+
      '</div>'
    : '';
  var items = list.map(function(t){
    var open = !!s.theoryOpen[t.id];
    var heatDots = '';
    for(var n=1;n<=4;n++){ heatDots += '<span class="heat-dot '+(n<=t.heat?'is-on':'')+'"></span>'; }
    var mineTag = t.mine
      ? '<span class="tag-mine">YOURS</span><span class="delete-link" data-act="deleteTheory" data-id="'+esc(t.id)+'">✕ Delete</span>'
      : '';
    var openBlock = '';
    if(open){
      var comments = (s.remoteComments[t.id]||[]);
      var commentsHtml = comments.map(function(c, idx){
        var mine = s.user && c.user_id === s.user.id;
        return '<div class="comment-row"><span><strong>'+esc(c.user_name||'Fan')+':</strong> '+esc(c.body)+'</span>'+(mine?'<span class="delete-link" data-act="deleteComment" data-id="'+esc(t.id)+'" data-idx="'+idx+'">✕</span>':'')+'</div>';
      }).join('') || '<p class="empty-note" style="padding:8px 0">No comments yet — be the first.</p>';
      var draft = s.commentDrafts[t.id] || '';
      var agree = s.myVote[t.id] === 'agree', disagree = s.myVote[t.id] === 'disagree';
      var sourceLine = t.source ? '<p class="theory-source">via '+esc(t.source)+'</p>' : '';
      openBlock =
        '<p class="theory-body">'+esc(t.body)+'</p>'+
        sourceLine+
        '<div class="vote-row">'+
          '<button type="button" class="vote-btn '+(agree?'is-on':'')+'" data-act="vote" data-id="'+esc(t.id)+'" data-type="agree">▲ Agree <span>'+(s.upvotes[t.id]||0)+'</span></button>'+
          '<button type="button" class="vote-btn '+(disagree?'is-on':'')+'" data-act="vote" data-id="'+esc(t.id)+'" data-type="disagree">▼ Disagree <span>'+(s.downvotes[t.id]||0)+'</span></button>'+
        '</div>'+
        '<div class="comments-block">'+commentsHtml+
          '<div class="comment-input-row" data-act="stop">'+
            '<input class="field-input comment-input" type="text" placeholder="Add a comment…" value="'+esc(draft)+'" data-bind="comment:'+esc(t.id)+'" data-focus-id="comment-'+esc(t.id)+'">'+
            '<button type="button" class="btn comment-post" data-act="addComment" data-id="'+esc(t.id)+'">Post</button>'+
          '</div>'+
        '</div>';
    }
    return (
      '<div class="theory" data-act="toggleTheoryOpen" data-id="'+esc(t.id)+'">'+
        '<div class="theory-head">'+
          '<div class="theory-title-row"><h4 class="theory-title">'+esc(t.title)+'</h4>'+mineTag+'</div>'+
          '<span class="theory-chevron">'+(open?'▾':'▸')+'</span>'+
        '</div>'+
        '<div class="heat-row"><span class="heat-label">Buzz</span><div class="heat-dots">'+heatDots+'</div></div>'+
        openBlock+
      '</div>'
    );
  }).join('');

  if(list.length === 0){
    items = '<p class="empty-note">No theories match &ldquo;'+esc(s.theorySearch)+'&rdquo;.</p>';
  }

  return (
    '<div class="tab-panel">'+
      '<button type="button" class="btn '+(s.showNewTheory?'':'btn-primary')+'" style="margin:4px 0" data-act="toggleNewTheoryForm">'+(s.showNewTheory?'Cancel':'+ Submit your own theory')+'</button>'+
      form+items+
    '</div>'
  );
}
