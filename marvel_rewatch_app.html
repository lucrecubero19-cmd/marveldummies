/* ---------- render loop with focus + scroll preservation ---------- */
var root = document.getElementById('app');
function render(){
  document.documentElement.setAttribute('data-app-theme', state.theme);
  var active = document.activeElement;
  var focusId = (active && active.dataset) ? active.dataset.focusId : null;
  var selStart = null, selEnd = null;
  if(active && typeof active.selectionStart === 'number'){ selStart = active.selectionStart; selEnd = active.selectionEnd; }
  var oldContent = root.querySelector('.app-content');
  var oldScrollTop = oldContent ? oldContent.scrollTop : 0;
  root.innerHTML = template(state);
  var newContent = root.querySelector('.app-content');
  if(newContent) newContent.scrollTop = oldScrollTop;
  if(focusId){
    var el = root.querySelector('[data-focus-id="'+focusId+'"]');
    if(el){
      el.focus({preventScroll:true});
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

/* ---------- event delegation ---------- */
root.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el) return;
  if(el.tagName === 'A') e.preventDefault();
  var act = el.dataset.act, id = el.dataset.id;
  switch(act){
    case 'stop': break;
    case 'dismissCookieNotice': dismissCookieNotice(); break;
    case 'showLegal': showLegal(); break;
    case 'closeLegal': closeLegal(); break;
    case 'signIn': signInWithGoogle(); break;
    case 'signOut': signOut(); break;
    case 'dismissAuthPrompt': dismissAuthPrompt(); break;
    case 'dismissFanNotice': dismissFanNotice(); break;
    case 'requestDeleteAccount': requestDeleteAccount(); break;
    case 'setTab': setTab(id); break;
    case 'toggleFilters': toggleFilters(); break;
    case 'focusRoadmapItem': focusRoadmapItem(id); break;
    case 'toggleEra': toggleEra(id); break;
    case 'toggleWatched': toggleWatched(id); break;
    case 'toggleFavorite': toggleFavorite(id); break;
    case 'toggleStoryboard': toggleStoryboard(); break;
    case 'saveDisplayName': saveDisplayName(); break;
    case 'dismissToast': dismissToast(); break;
    case 'setRating': setRating(id, Number(el.dataset.n)); break;
    case 'toggleTheoryOpen': toggleTheoryOpen(id); break;
    case 'vote': vote(id, el.dataset.type); break;
    case 'deleteComment': deleteComment(id, Number(el.dataset.idx)); break;
    case 'deleteTheory': deleteTheory(id); break;
    case 'toggleNewTheoryForm': toggleNewTheoryForm(); break;
    case 'submitTheory': submitTheory(); break;
    case 'addComment': addComment(id); break;
    case 'toggleNotif': toggleNotif(); break;
    case 'setTheme': setTheme(el.dataset.theme); break;
    case 'resetProgress':
      if(window.confirm('Reset all watched progress and ratings? This can’t be undone.')) resetProgress();
      break;
  }
});
root.addEventListener('change', function(e){
  var t = e.target;
  if(t.name === 'viewmode'){ setViewMode(t.dataset.value); }
  else if(t.name === 'section'){ setSection(t.dataset.value); }
  else if(t.name === 'theorysort'){ setTheorySort(t.dataset.value); }
  else if(t.name === 'layout'){ setLayout(t.dataset.value); }
});
root.addEventListener('input', function(e){
  var t = e.target;
  var bind = t.dataset.bind;
  if(!bind) return;
  if(bind === 'search'){ setSearch(t.value); }
  else if(bind === 'theorySearch'){ setTheorySearch(t.value); }
  else if(bind === 'theoryTitle'){ setNewTheoryTitle(t.value); }
  else if(bind === 'theoryBody'){ setNewTheoryBody(t.value); }
  else if(bind.indexOf('comment:') === 0){ setCommentDraft(bind.slice(8), t.value); }
  else if(bind === 'displayName'){ setDisplayNameDraft(t.value); }
});
/* 'scroll' doesn't bubble, so listen on the capture phase to catch it from .app-content */
root.addEventListener('scroll', function(e){
  if(!e.target.classList || !e.target.classList.contains('app-content')) return;
  var st = e.target.scrollTop;
  if(st > 24 && !state.scrolled){ state.scrolled = true; commit(); }
  else if(st <= 2 && state.scrolled){ state.scrolled = false; commit(); }
}, true);

render();
showSplash();
initAuth();
window.addEventListener('pageshow', function(e){
  if(e.persisted && sb){
    sb.auth.getSession().then(function(res){
      var nextUser = res.data.session ? res.data.session.user : null;
      if((state.user && nextUser && state.user.id !== nextUser.id) || (!!state.user) !== (!!nextUser)){
        state.user = nextUser;
        loadRemoteData();
      }
    });
  }
});

/* ---------- opening transition ---------- */
function showSplash(){
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced) return;
  var el = document.createElement('div');
  el.className = 'app-splash';
  el.setAttribute('aria-hidden', 'true');
  el.innerHTML =
    '<div class="app-splash-inner">'+
      '<div class="app-splash-flash"></div>'+
      '<div class="app-splash-word">Marvel</div>'+
      '<div class="app-splash-kicker">For Dummies</div>'+
    '</div>';
  document.body.appendChild(el);
  setTimeout(function(){
    el.classList.add('is-leaving');
    setTimeout(function(){ el.remove(); }, 500);
  }, 1600);
}
</script>
